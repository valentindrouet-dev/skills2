<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Talents - Orbes de Feu</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function ArbreTalents() {
          const [pointsDisponibles, setPointsDisponibles] = useState(10);
          const [talentsActifs, setTalentsActifs] = useState({});
          const [hoveredTalent, setHoveredTalent] = useState(null);

          // Talents basés sur la maquette "Orbes de Feu"
          const talents = {
            // Colonne gauche
            attaques_feu: {
              id: 'attaques_feu',
              nom: 'Vos attaques infligent 🔥',
              cout: 1,
              description: 'Vos attaques infligent 🔥',
              position: { x: 100, y: 50 },
              prerequis: [],
              type: 'rectangle',
              couleur: '#9ca3af'
            },
            endu_1: {
              id: 'endu_1',
              nom: 'Endu +2',
              cout: 1,
              description: '+2 Endurance',
              position: { x: 100, y: 180 },
              prerequis: ['attaques_feu'],
              type: 'petit_carre',
              couleur: '#67e8f9'
            },
            degats_1: {
              id: 'degats_1',
              nom: 'Dégâts +2',
              cout: 1,
              description: '+2 Dégâts',
              position: { x: 200, y: 180 },
              prerequis: ['attaques_feu'],
              type: 'petit_carre',
              couleur: '#a16f5e'
            },
            esquive: {
              id: 'esquive',
              nom: 'Vous possédez esquive 6+',
              cout: 2,
              description: 'Vous possédez esquive 6+',
              position: { x: 100, y: 310 },
              prerequis: ['endu_1'],
              type: 'rectangle',
              couleur: '#9ca3af'
            },
            degats_2: {
              id: 'degats_2',
              nom: 'Dégâts +2',
              cout: 1,
              description: '+2 Dégâts',
              position: { x: 100, y: 440 },
              prerequis: ['esquive'],
              type: 'petit_carre',
              couleur: '#a16f5e'
            },
            lancer_orbe: {
              id: 'lancer_orbe',
              nom: 'Vous lancez +1 orbe de feu',
              cout: 2,
              description: 'Vous lancez +1 orbe de feu',
              position: { x: 100, y: 570 },
              prerequis: ['degats_2'],
              type: 'rectangle',
              couleur: '#4e8b51'
            },

            // Colonne centrale
            orbes_feu: {
              id: 'orbes_feu',
              nom: 'Orbes de Feu',
              cout: 3,
              description: 'Vous lancez 2+ orbes de feu\nChacun inflige 🔥💥',
              position: { x: 350, y: 50 },
              prerequis: [],
              type: 'grand_carre',
              couleur: '#496f93'
            },
            endu_2: {
              id: 'endu_2',
              nom: 'Endu +2',
              cout: 1,
              description: '+2 Endurance',
              position: { x: 350, y: 300 },
              prerequis: ['orbes_feu'],
              type: 'petit_carre',
              couleur: '#67e8f9'
            },
            multi_orbes: {
              id: 'multi_orbes',
              nom: 'Vous pouvez lancer plusieurs orbes de feu ensemble',
              cout: 2,
              description: 'Vous pouvez lancer plusieurs orbes de feu ensemble',
              position: { x: 350, y: 430 },
              prerequis: ['endu_2'],
              type: 'rectangle',
              couleur: '#9ca3af'
            },
            orbes_bouclier: {
              id: 'orbes_bouclier',
              nom: 'Vos orbes de feu infligent 🔥 même sans passer la 🛡️',
              cout: 3,
              description: 'Vos orbes de feu infligent 🔥 même sans passer la 🛡️',
              position: { x: 350, y: 560 },
              prerequis: ['multi_orbes'],
              type: 'rectangle',
              couleur: '#9ca3af'
            },

            // Colonne droite
            immunite_feu: {
              id: 'immunite_feu',
              nom: 'Vous ne subissez jamais 🔥',
              cout: 2,
              description: 'Vous ne subissez jamais 🔥',
              position: { x: 600, y: 50 },
              prerequis: [],
              type: 'rectangle',
              couleur: '#9ca3af'
            },
            rapidite: {
              id: 'rapidite',
              nom: 'Vous agissez contre les adversaires rapides',
              cout: 2,
              description: 'Vous agissez contre les adversaires rapides',
              position: { x: 600, y: 180 },
              prerequis: ['immunite_feu'],
              type: 'rectangle',
              couleur: '#9ca3af'
            },
            bouclier_feu: {
              id: 'bouclier_feu',
              nom: 'Bouclier de Feu',
              cout: 3,
              description: 'Après avoir subi 1 attaque au contact,\nvous infligez 🔥 à l\'adversaire',
              position: { x: 600, y: 310 },
              prerequis: ['rapidite'],
              type: 'grand_carre',
              couleur: '#8b5a9e'
            },
            degats_3: {
              id: 'degats_3',
              nom: 'Dégâts +1',
              cout: 1,
              description: '+1 Dégâts',
              position: { x: 600, y: 560 },
              prerequis: ['bouclier_feu'],
              type: 'petit_carre',
              couleur: '#a16f5e'
            },
            orbe_debut: {
              id: 'orbe_debut',
              nom: 'Vous lancez 1 orbe de feu au début du combat',
              cout: 2,
              description: 'Vous lancez 1 orbe de feu au début du combat',
              position: { x: 600, y: 690 },
              prerequis: ['degats_3'],
              type: 'rectangle',
              couleur: '#d4af37'
            }
          };

          const toggleTalent = (talentId) => {
            const talent = talents[talentId];

            if (talentsActifs[talentId]) {
              setTalentsActifs(prev => {
                const newState = { ...prev };
                delete newState[talentId];
                return newState;
              });
              setPointsDisponibles(prev => prev + talent.cout);
            } else {
              const prerequisRemplis = talent.prerequis.every(prereq => talentsActifs[prereq]);

              if (!prerequisRemplis && talent.prerequis.length > 0) {
                alert('Vous devez d\'abord débloquer les talents prérequis !');
                return;
              }

              if (pointsDisponibles < talent.cout) {
                alert('Points insuffisants !');
                return;
              }

              setTalentsActifs(prev => ({ ...prev, [talentId]: true }));
              setPointsDisponibles(prev => prev - talent.cout);
            }
          };

          const peutEtreActive = (talentId) => {
            const talent = talents[talentId];
            const prerequisRemplis = talent.prerequis.every(prereq => talentsActifs[prereq]);
            return prerequisRemplis && (talentsActifs[talentId] || pointsDisponibles >= talent.cout);
          };

          const resetTalents = () => {
            setTalentsActifs({});
            setPointsDisponibles(10);
          };

          const getTalentDimensions = (type) => {
            switch(type) {
              case 'grand_carre': return { width: 200, height: 200 };
              case 'rectangle': return { width: 200, height: 80 };
              case 'petit_carre': return { width: 80, height: 80 };
              default: return { width: 200, height: 80 };
            }
          };

          // Calcul des connexions
          const renderConnections = () => {
            const connections = [];
            Object.values(talents).forEach(talent => {
              talent.prerequis.forEach(prereqId => {
                const prereq = talents[prereqId];
                const isActive = talentsActifs[prereqId] && talentsActifs[talent.id];
                const isHighlighted = hoveredTalent === talent.id || hoveredTalent === prereqId;

                const prereqDim = getTalentDimensions(prereq.type);
                const talentDim = getTalentDimensions(talent.type);

                const x1 = prereq.position.x + prereqDim.width / 2;
                const y1 = prereq.position.y + prereqDim.height;
                const x2 = talent.position.x + talentDim.width / 2;
                const y2 = talent.position.y;

                connections.push(
                  <line
                    key={`${prereqId}-${talent.id}`}
                    x1={x1}
                    y1={y1}
                    x2={x2}
                    y2={y2}
                    stroke={isActive ? '#fbbf24' : isHighlighted ? '#94a3b8' : '#475569'}
                    strokeWidth={isActive ? 3 : 2}
                    strokeDasharray={isActive ? '0' : '5,5'}
                    className="transition-all duration-300"
                  />
                );
              });
            });
            return connections;
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 p-8">
              <div className="max-w-7xl mx-auto">
                {/* Header */}
                <div className="bg-gradient-to-r from-orange-600 to-orange-500 rounded-t-lg p-6 shadow-lg">
                  <h1 className="text-4xl font-bold text-center text-white tracking-wide">
                    🔥 Arbre de Talents - Orbes de Feu
                  </h1>
                </div>

                {/* Points disponibles */}
                <div className="bg-slate-800 border-2 border-orange-500 p-4 flex justify-center gap-6">
                  <span className="text-amber-400 font-bold text-lg">
                    Points disponibles: {pointsDisponibles}
                  </span>
                  <button
                    onClick={resetTalents}
                    className="px-4 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-semibold transition-colors"
                  >
                    Réinitialiser
                  </button>
                  <a
                    href="index.html"
                    className="px-4 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-semibold transition-colors no-underline"
                  >
                    ← Retour
                  </a>
                </div>

                {/* Arbre de talents */}
                <div className="bg-slate-700 rounded-b-lg p-8 shadow-2xl relative" style={{ minHeight: '900px' }}>
                  <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 1 }}>
                    {renderConnections()}
                  </svg>

                  {/* Talents */}
                  <div className="relative" style={{ zIndex: 2 }}>
                    {Object.values(talents).map(talent => {
                      const isActive = talentsActifs[talent.id];
                      const isAvailable = peutEtreActive(talent.id);
                      const isHovered = hoveredTalent === talent.id;
                      const dim = getTalentDimensions(talent.type);

                      return (
                        <div
                          key={talent.id}
                          className="absolute group"
                          style={{
                            left: `${talent.position.x}px`,
                            top: `${talent.position.y}px`,
                            width: `${dim.width}px`,
                            height: `${dim.height}px`
                          }}
                          onMouseEnter={() => setHoveredTalent(talent.id)}
                          onMouseLeave={() => setHoveredTalent(null)}
                        >
                          <button
                            onClick={() => toggleTalent(talent.id)}
                            disabled={!isAvailable && !isActive}
                            className={`
                              w-full h-full p-3 rounded-lg border-2 transition-all duration-300 relative
                              ${isActive
                                ? 'border-amber-400 shadow-lg shadow-amber-500/50 scale-105'
                                : isAvailable
                                ? 'border-slate-400 hover:border-amber-400 hover:shadow-lg hover:scale-105'
                                : 'border-slate-700 opacity-50 cursor-not-allowed'
                              }
                              ${isHovered ? 'ring-2 ring-amber-400' : ''}
                            `}
                            style={{
                              backgroundColor: isActive ? talent.couleur : '#475569',
                              fontSize: talent.type === 'petit_carre' ? '0.7rem' : '0.85rem'
                            }}
                          >
                            {/* Coût */}
                            <div className={`
                              absolute -top-2 -right-2 w-8 h-8 rounded-full
                              flex items-center justify-center font-bold text-xs
                              ${isActive ? 'bg-amber-500 text-white' : 'bg-slate-500 text-white'}
                              border-2 ${isActive ? 'border-amber-300' : 'border-slate-400'}
                            `}>
                              {talent.cout}
                            </div>

                            {/* Checkbox indicator */}
                            <div className={`
                              absolute top-1 left-1 w-3 h-3 border-2 rounded
                              ${isActive ? 'bg-amber-400 border-amber-500' : 'border-slate-400'}
                            `}>
                              {isActive && (
                                <svg className="w-full h-full text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                                </svg>
                              )}
                            </div>

                            <div className="text-white font-bold text-center h-full flex items-center justify-center px-2" style={{ whiteSpace: 'pre-line' }}>
                              {talent.nom}
                            </div>
                          </button>

                          {/* Infobulle */}
                          {isHovered && (
                            <div className="absolute left-1/2 -translate-x-1/2 -top-2 -translate-y-full w-64 bg-slate-900 border-2 border-amber-400 rounded-lg p-3 shadow-2xl z-50">
                              <div className="text-amber-400 font-bold text-sm mb-1">{talent.nom}</div>
                              <div className="text-white text-xs mb-2" style={{ whiteSpace: 'pre-line' }}>{talent.description}</div>
                              <div className="flex justify-between items-center text-xs">
                                <span className="text-slate-300">Coût: <span className="text-amber-400 font-bold">{talent.cout} points</span></span>
                              </div>
                              {talent.prerequis.length > 0 && (
                                <div className="mt-2 pt-2 border-t border-slate-700">
                                  <div className="text-slate-400 text-xs">
                                    Prérequis: {talent.prerequis.map(p => talents[p].nom).join(', ')}
                                  </div>
                                </div>
                              )}
                              <div className="absolute left-1/2 -translate-x-1/2 -bottom-2 w-0 h-0 border-l-8 border-r-8 border-t-8 border-transparent border-t-amber-400"></div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Légende */}
                <div className="mt-6 bg-slate-800 rounded-lg p-4 border border-slate-600">
                  <div className="text-slate-300 text-sm mb-2">
                    <span className="font-semibold">Instructions:</span>
                  </div>
                  <ul className="text-slate-400 text-xs space-y-1 ml-6">
                    <li>• Survolez un talent pour voir ses détails complets</li>
                    <li>• Cliquez pour activer/désactiver un talent</li>
                    <li>• Les talents grisés nécessitent des prérequis</li>
                    <li>• Les lignes en pointillés montrent les connexions inactives</li>
                  </ul>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArbreTalents />);
    </script>
</body>
</html>
