            .no-print {

            }

                background: white !important;
            }

            /* A4 portrait pour l'arbre */
            @page arbre {
                size: A4 portrait;

            }

            /* A4 portrait pour la feuille */
            @page feuille {
                size: A4 portrait;
                margin: 0.5cm;
            }

            .print-page-break {
                page-break-after: always;
            }

            .print-talent-tree {
                background: white !important;
                padding: 10px;
                max-width: 100%;
                overflow: visible !important;
                page: arbre;
                transform: scale(0.7) !important;
                transform-origin: top left !important;
            }

            .print-talent {
                border: 2px solid #333 !important;
                box-shadow: none !important;
                transform: none !important;

                color: black !important;
            }

            /* Talents ACTIFS : garder les couleurs */
            .print-talent.active {
                border-width: 3px !important;
                border-color: #000 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: inherit !important;
            }

            .print-talent.active * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Masquer les badges pour l'impression */
            .print-talent > div:first-child {
                opacity: 0.8;
            }

            /* Styles pour la feuille de perso */
            .print-feuille {
                page: feuille;
                transform: scale(0.85) !important;
                transform-origin: top left !important;
                max-width: 100%;
                overflow: hidden !important;
            }

            .print-feuille * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .bg-white {
                background: white !important;
            }
        }

        .dragging {
            opacity: 0.5;
            cursor: move;
        }

        /* Styles pour les icônes inline (emoji-like) */

            height: 1em;

        function ArbreTalents() {
          // Grille de placement : points d'ancrage tous les 20px
          // Génère automatiquement les points de 0 à 1340 (68 colonnes) et 0 à 2400 (121 lignes)
          const gridColumns = Array.from({ length: 68 }, (_, i) => i * 20); // [0, 20, 40, 60, ..., 1340]

          // Les 8 classes fixes (ordre alphabétique)

          // Couleurs par classe (correspond à getCouleurClasse)
          const COULEURS_CLASSES = {
            'Apothicaire': { bg: 'bg-green-600', border: 'border-green-500', hover: 'hover:bg-green-700' },
            'Artificier': { bg: 'bg-cyan-600', border: 'border-cyan-500', hover: 'hover:bg-cyan-700' },
            'Chasseur': { bg: 'bg-amber-700', border: 'border-amber-600', hover: 'hover:bg-amber-800' },
            'Destructeur': { bg: 'bg-red-600', border: 'border-red-500', hover: 'hover:bg-red-700' },
            'Déviant': { bg: 'bg-purple-600', border: 'border-purple-500', hover: 'hover:bg-purple-700' },
            'Gardien': { bg: 'bg-blue-600', border: 'border-blue-500', hover: 'hover:bg-blue-700' },
            'Lamevent': { bg: 'bg-slate-600', border: 'border-slate-500', hover: 'hover:bg-slate-700' },
            'Pyromane': { bg: 'bg-orange-600', border: 'border-orange-500', hover: 'hover:bg-orange-700' }
          };

          // Bonus de PV par classe (non-éditable)
          const BONUS_PV_PAR_CLASSE = {
            'Pyromane': 10,
            'Déviant': 10,
            'Artificier': 14,
            'Apothicaire': 12,
            'Chasseur': 16,
            'Destructeur': 16,
            'Gardien': 18,
            'Lamevent': 14
          };

          // États pour la gestion des arbres GM
          const [arbreActuel, setArbreActuel] = useState(() => {
            // Si un snapshot est détecté dans l'URL, démarrer sur null pour éviter le flash du Gardien
            const hash = window.location.hash;
            if (hash.includes('snapshot=')) {
              return null; // Sera défini lors du chargement du snapshot
            }
            return 'Gardien'; // Mode GM par défaut
          });
          const [nomArbrePartage, setNomArbrePartage] = useState(''); // Nom de l'arbre partagé (PJ)

          const [pointsDisponibles, setPointsDisponibles] = useState(5);
          const [pointsMax, setPointsMax] = useState(5);
          const [talentsActifs, setTalentsActifs] = useState({});
          const [hoveredTalent, setHoveredTalent] = useState(null);
          const [tooltipTalent, setTooltipTalent] = useState(null); // ID du talent dont on affiche le tooltip
          const [modeEdition, setModeEdition] = useState(false);
          const [vueActive, setVueActive] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.get('view') || 'arbre'; // 'arbre' ou 'feuille'
          });
          const [zoom, setZoom] = useState(() => {
            const savedZoom = localStorage.getItem('zoomLevel');
            return savedZoom ? parseFloat(savedZoom) : 1;
          }); // Zoom level: 0.5 à 1.5
          const [notification, setNotification] = useState(null); // Pour les messages temporaires

          // États pour les caractéristiques du personnage
          const [nomPersonnage, setNomPersonnage] = useState('');
          const [niveau, setNiveau] = useState(1);

          // État pour la page Informations (9e "classe" pour consignes/index)
          const [pageInfoContenu, setPageInfoContenu] = useState('');

          // État pour l'éditeur de mots-clés
          const [editeurMotsCles, setEditeurMotsCles] = useState(false);
          const [motCleEnEdition, setMotCleEnEdition] = useState(null);
          const [motsClesCustom, setMotsClesCustom] = useState(() => {
            const saved = localStorage.getItem('motsClesCustom');
            return saved ? JSON.parse(saved) : {};
          });

          // État pour les marqueurs dynamiques personnalisés (comme {ORBES})
          // Les marqueurs sont maintenant sauvegardés PAR CLASSE, pas globalement
          const [editeurMarqueurs, setEditeurMarqueurs] = useState(false);
          const [marqueurEnEdition, setMarqueurEnEdition] = useState(null);
          const [marqueursCustom, setMarqueursCustom] = useState({});

          // État pour le gestionnaire d'icônes

            return saved ? JSON.parse(saved) : [];
          });

          // Fonction pour obtenir le bonus de PV selon la classe (non-éditable)

          // Mapping niveau -> points de talents max

            1: 5,

            3: 15,
            4: 20,
            5: 25,
            6: 30,

          }, [niveau, talentsActifs, talents]);

              typeTalent: 'grand_carre', // grand_carre (200x200), rectangle (200x100), petit_carre (100x100)
              couleurTalent: 'action' // action, amelioration, passif
            },
            alchimiste1: {
              id: 'alchimiste1',
              nom: 'Alchimiste : Artificier',
              cout: 2,
              bonus: 'Endu +2',
              description: 'Vous débutez chaque combat avec 1 grenade qui inflige des dégâts à tous les combattants en petit rayon',

              position: { x: 750, y: 0 },
              prerequis: ['analyse'],
              categorie: 'soin',
              typeTalent: 'grand_carre',

            },
            vie2: {

              typeTalent: 'grand_carre',
              couleurTalent: 'action'
            }
          };

          const [talents, setTalents] = useState(talentsParDefaut);
          const [editingTalent, setEditingTalent] = useState(null);
          const [draggingTalent, setDraggingTalent] = useState(null);
          const [dragOffset, setDragOffset] = useState(null); // Offset entre la souris et le coin sup gauche du talent
          const [targetGridPoint, setTargetGridPoint] = useState(null); // Point d'ancrage cible pendant le drag
          // Détecter le mode lecture seule dès l'initialisation
          const [modeLectureSeule, setModeLectureSeule] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            const hash = window.location.hash;
            // Mode lecture seule si ?data= OU #snapshot= présent
            return params.has('data') || hash.includes('snapshot=');
          });

          // Détecter le mode player (partage pour les joueurs)
          const [modePlayer, setModePlayer] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            const hash = window.location.hash;
            // Mode player si ?player=true OU #snapshot= présent
            return params.get('player') === 'true' || hash.includes('snapshot=');
          });

          // Détecter le mode print (impression avec fond blanc)
          const [modePrint, setModePrint] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.get('print') === 'true';
          });

          const categories = {
            vie: { couleur: 'bg-orange-600', nom: 'Vie' },
            combat: { couleur: 'bg-blue-600', nom: 'Combat' },
            analyse: { couleur: 'bg-purple-600', nom: 'Analyse' },
            soin: { couleur: 'bg-green-600', nom: 'Soin' }
          };

          // Types de talents et leurs dimensions
          const typesTalent = {
            grand_carre: { width: 200, height: 200, nom: 'Grand Carré' },
            rectangle: { width: 200, height: 80, nom: 'Rectangle' },
            petit_carre: { width: 80, height: 80, nom: 'Petit Carré' },
            // Compatibilité anciens noms
            action: { width: 200, height: 200, nom: 'Grand Carré' },
            passif: { width: 200, height: 80, nom: 'Rectangle' },
            bonus: { width: 80, height: 80, nom: 'Petit Carré' },
            competence: { width: 80, height: 80, nom: 'Petit Carré (legacy)' }  // Rétrocompatibilité
          };

          // Couleurs de talents
          const couleursTalent = {
            action: { code: '#4278ac', nom: 'Actions' },           // Blue
            amelioration: { code: '#4e8b51', nom: 'Améliorations' },     // Green
            aventure: { code: '#8B6F47', nom: 'Aventure' },        // Brown
            competence: { code: '#E57036', nom: 'Comp (legacy)' },  // Orange - Rétrocompatibilité
            degats: { code: '#d56161', nom: 'Dégâts' },
            endu: { code: '#6fbdb5', nom: 'Endu' },
            maitrise: { code: '#ca8a04', nom: 'Maîtrises' },        // Yellow
            passif: { code: '#999999', nom: 'Passifs' },
            reaction: { code: '#7d5f92', nom: 'Réactions' },           // Purple
            vie: { code: '#e281d1', nom: 'Vie' }                   // Rose
          };

          // Dictionnaire des mots-clés disponibles pour l'index (par défaut)
          const MOTS_CLES_INDEX_DEFAUT = {
            'au_contact': {
              titre: 'Au contact',
              definition: 'Un combattant est au contact d\'un autre quand il se trouve dans un petit rayon autour de son socle.'
            }
          };

          // Fonction pour obtenir tous les mots-clés (défaut + custom, en excluant les supprimés)
          const getTousMotsCles = () => {
            const tous = { ...MOTS_CLES_INDEX_DEFAUT };
            // Appliquer les mots-clés custom (ajouts et suppressions)
            Object.keys(motsClesCustom).forEach(cle => {
              if (motsClesCustom[cle] === null) {
                // null = supprimé, donc on le retire
                delete tous[cle];
              } else {
                // Ajout ou remplacement
                tous[cle] = motsClesCustom[cle];
              }
            });
            return tous;
          };

          // Helper pour obtenir les dimensions d'un talent
          const getDimensionsTalent = (talent) => {
            const type = talent?.typeTalent || 'grand_carre'; // Par défaut: Grand Carré
            return typesTalent[type] || typesTalent.grand_carre;
          };

          // Helper pour obtenir la couleur d'un talent
          const getCouleurTalent = (talent) => {
            const couleur = talent?.couleurTalent || 'action'; // Par défaut: action
            return couleursTalent[couleur]?.code || couleursTalent.action.code;
          };

          // Helpers pour vérifier les types de talents
          const isGrandCarre = (talent) => talent.typeTalent === 'grand_carre' || talent.typeTalent === 'action';
          const isRectangle = (talent) => talent.typeTalent === 'rectangle' || talent.typeTalent === 'passif';
          const isPetitCarre = (talent) => talent.typeTalent === 'petit_carre' || talent.typeTalent === 'bonus';

          // Couleurs de bandeau par classe
          const getCouleurClasse = (classe) => {
            const couleurs = {
              'Apothicaire': 'from-green-600 to-green-500',
              'Artificier': 'from-cyan-600 to-cyan-500',
              'Chasseur': 'from-amber-700 to-amber-600',
              'Destructeur': 'from-red-600 to-red-500',
              'Déviant': 'from-purple-600 to-purple-500',
              'Gardien': 'from-blue-600 to-blue-500',
              'Lamevent': 'from-slate-600 to-slate-500',
              'Pyromane': 'from-orange-600 to-orange-500'
            };
            return couleurs[classe] || 'from-amber-600 to-amber-500';
          };

          const getCouleurClasseHex = (classe) => {
            const couleurs = {
              'Apothicaire': '#16a34a',
              'Artificier': '#0891b2',
              'Chasseur': '#b45309',
              'Destructeur': '#dc2626',
              'Déviant': '#9333ea',
              'Gardien': '#2563eb',
              'Lamevent': '#475569',
              'Pyromane': '#ea580c'
            };
            return couleurs[classe] || '#d97706';
          };

          // Calculer la valeur d'un marqueur personnalisé
          const getMarqueurValue = (nom) => {
            const marqueur = marqueursCustom[nom];
            if (!marqueur) return 0;

            let total = marqueur.valeurBase || 0;

            // Ajouter les bonus des talents actifs
            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent?.effetSpecial?.type === 'bonus_marqueur' && talent.effetSpecial.marqueur === nom) {
                const source = talent.effetSpecial.source;
                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                if (source === 'fixe') {
                  total += Math.floor(talent.effetSpecial.valeur || multiplicateur);
                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                } else if (source === 'endu') {
                  total += Math.floor(getTotalEndu() * multiplicateur);
                } else if (source === 'vie') {
                  total += Math.floor(getTotalVie() * multiplicateur);
                }
              }
            });

            return total;
          };

          // Remplacer les marqueurs dynamiques dans les descriptions
          const replaceMarkers = (description) => {
            if (!description) return description;

            let result = description;

            // Remplacer les marqueurs simples et avec formules
            result = result.replace(/\{([^}]+)\}/g, (match, formula) => {
              try {
                // Vérifier si c'est une icône {IMG:filename}
                if (formula.startsWith('IMG:')) {
                  const iconName = formula.substring(4).trim(); // Retirer "IMG:"
                  // Trouver l'icône dans la liste
                  const icone = iconesDisponibles.find(icon => icon.name === iconName);
                  if (icone) {
                    return `<img src="${icone.data}" alt="${iconName}" class="emoji-like" />`;
                  } else {
                    return match; // Si l'icône n'existe pas, laisser tel quel
                  }
                }

                // Remplacer les variables par leurs valeurs
                let expr = formula
                  .replace(/ENDU/g, getTotalEndu())
                  .replace(/VIE/g, getTotalVie())
                  .replace(/DEGATS/g, getTotalDegats())
                  .replace(/NIVEAU/g, niveau)
                  .replace(/PV/g, getPointsDeVie());

                // Remplacer les 8 compétences
                COMPETENCES.forEach(comp => {
                  const regex = new RegExp(comp, 'g');
                  expr = expr.replace(regex, getTotalCompetence(comp));
                });

                // Remplacer les marqueurs personnalisés
                Object.keys(marqueursCustom).forEach(nomMarqueur => {
                  const regex = new RegExp(nomMarqueur, 'g');
                  expr = expr.replace(regex, getMarqueurValue(nomMarqueur));
                });

                // Évaluer la formule de manière sûre (seulement +, -, *, /)
                if (/^[\d\s+\-*/.()]+$/.test(expr)) {
                  const value = eval(expr);
                  return Math.floor(value);
                }

                return match; // Si la formule est invalide, laisser tel quel
              } catch (e) {
                return match; // En cas d'erreur, laisser tel quel
              }
            });

            return result;
          };

          // Obtenir les classes de couleur selon le coût du talent
          const getCoutColorClasses = (cout, isActive) => {
            if (!isActive) return 'bg-slate-500 border-slate-400';

            if (cout === 0) return 'bg-cyan-500 border-cyan-300'; // Bleu clair pour 0 points
            if (cout === 1) return 'bg-green-500 border-green-300';
            if (cout === 2) return 'bg-amber-500 border-amber-300';
            if (cout >= 3) return 'bg-orange-500 border-orange-300';

            return 'bg-amber-500 border-amber-300'; // Par défaut
          };

          // Calculer la taille de police dynamique selon la longueur du texte et largeur du talent
          const getDynamicFontSize = (text, baseSize, talentWidth) => {
            if (!text) return baseSize;

            // Estimation : ~7 pixels par caractère en moyenne pour la police de base
            const charWidthEstimate = baseSize * 0.5;
            const maxCharsPerLine = Math.floor(talentWidth / charWidthEstimate);
            const lines = text.split('\n');

            // Vérifier si une ligne dépasse la largeur
            const hasOverflow = lines.some(line => line.length > maxCharsPerLine);

            if (hasOverflow) {
              // Réduire proportionnellement
              const maxLineLength = Math.max(...lines.map(l => l.length));
              const ratio = maxCharsPerLine / maxLineLength;
              return Math.max(baseSize * ratio * 0.9, baseSize * 0.6); // Min 60% de la taille de base
            }

            return baseSize;
          };

          // Calculer le total d'ENDU (via effets spéciaux uniquement)
          const getTotalEndu = () => {

            // Effets spéciaux: bonus d'ENDU depuis les talents
            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent?.effetSpecial?.type === 'bonus_endu') {
                const source = talent.effetSpecial.source;
                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                if (source === 'fixe') {
                  total += Math.floor(talent.effetSpecial.valeur || multiplicateur);
                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                }
              }
            });

            return total;
          };

          // Calculer le total de DEGATS (via effets spéciaux uniquement)
          const getTotalDegats = () => {

            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent?.effetSpecial?.type === 'bonus_degats') {
                const source = talent.effetSpecial.source;
                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                if (source === 'endu') {
                  total += Math.floor(getTotalEndu() * multiplicateur);
                } else if (source === 'vie') {
                  total += Math.floor(getTotalVie() * multiplicateur);
                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                } else if (source === 'fixe') {
                  total += Math.floor(talent.effetSpecial.valeur || multiplicateur);
                }
              }
            });

            return total;
          };

          // Calculer le total de VIE (via effets spéciaux uniquement)
          const getTotalVie = () => {

            Object.keys(talentsActifs).forEach(id => {

              if (talent?.effetSpecial?.type === 'bonus_vie') {

                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                }
              }
            });

            return total;

          const getPointsDeVie = () => {

          const findDependentTalents = (talentId, currentActifs, visited = new Set()) => {
            const dependents = [];

            // Protection contre cycles infinis
            if (visited.has(talentId)) return dependents;
            visited.add(talentId);

            // Simuler l'état après suppression de talentId
            const simulatedActifs = { ...currentActifs };

            Object.keys(currentActifs).forEach(id => {

              if (talent && talent.prerequis && Array.isArray(talent.prerequis) && talent.prerequis.includes(talentId)) {
                // Vérifier si ce talent a encore au moins un autre prérequis actif
                const hasOtherActivePrereq = talent.prerequis.some(prereqId =>
                  prereqId !== talentId && simulatedActifs[prereqId]
                );

                // Si le talent n'a plus aucun prérequis actif, il doit être désactivé
                if (!hasOtherActivePrereq) {
                  dependents.push(id);
                  // Récursion pour trouver les talents qui dépendent de celui-ci
                  const subDependents = findDependentTalents(id, simulatedActifs, visited);
                  dependents.push(...subDependents);

              }
            });

            return dependents;

          // Calculer les points dépensés EN AMONT d'un talent (dans ses prérequis récursifs)
          const getPointsEnAmont = (talentId, currentActifs = null, visited = new Set()) => {
            if (visited.has(talentId)) return 0;
            visited.add(talentId);

            const talent = talents[talentId];
            if (!talent || !talent.prerequis || talent.prerequis.length === 0) return 0;

            // Utiliser le state courant ou le state fourni
            const actifsToUse = currentActifs || talentsActifs;

            let total = 0;

            // Pour chaque prérequis actif
            talent.prerequis.forEach(prereqId => {
              if (actifsToUse[prereqId]) {
                // Ajouter le coût de ce prérequis
                total += talents[prereqId]?.cout || 0;
                // Récursion : ajouter les points en amont de ce prérequis
                total += getPointsEnAmont(prereqId, actifsToUse, visited);
              }
            });

            return total;

          const toggleTalent = (talentId) => {

            const talent = talents[talentId];

            if (talentsActifs[talentId]) {
              // Trouver tous les talents qui dépendent de celui-ci
              const dependents = findDependentTalents(talentId, talentsActifs);

              // Calculer le total des points à restituer
              let pointsToRestore = talent.cout;
              dependents.forEach(depId => {
                if (talents[depId]) {
                  pointsToRestore += talents[depId].cout;
                }
              });

              // Simuler le state après décochage pour calculer les points en amont
              const simulatedActifs = { ...talentsActifs };
              delete simulatedActifs[talentId];
              dependents.forEach(depId => {
                delete simulatedActifs[depId];
              });

              // Décocher le talent et ses dépendants
              setTalentsActifs(prev => {
                const newState = { ...prev };
                delete newState[talentId];

                // Décocher les dépendants
                dependents.forEach(depId => {
                  delete newState[depId];
                });

                return newState;
              });

              setPointsDisponibles(prev => prev + pointsToRestore);
            } else {
              // Au moins un prérequis doit être rempli (OU logique), ou aucun prérequis
              const prerequisRemplis = talent.prerequis.length === 0 || talent.prerequis.some(prereq => talentsActifs[prereq]);

              if (!prerequisRemplis) {
                showNotification('Vous devez sélectionner les talents prérequis !');
                return;
              }

              if (pointsDisponibles < talent.cout) {
                showNotification('Vous n\'avez plus assez de point de talents !');
                return;
              }

              // Si ce talent remplace un autre, décocher l'ancien et restituer ses points
              let pointsARestituer = 0;
              if (talent.remplace) {
                const talentRemplace = talents[talent.remplace];
                if (talentRemplace && talentsActifs[talent.remplace]) {
                  pointsARestituer = talentRemplace.cout;
                  console.log(`🔄 "${talent.nom}" remplace "${talentRemplace.nom}" - Restitution de ${pointsARestituer} points`);
                }
              }

              setTalentsActifs(prev => {
                const newState = { ...prev, [talentId]: true };
                // Décocher le talent remplacé s'il existe
                if (talent.remplace && prev[talent.remplace]) {
                  delete newState[talent.remplace];
                }
                return newState;
              });
              setPointsDisponibles(prev => prev - talent.cout + pointsARestituer);
            }
          };

          // Vérifier si un talent est bloqué par une exclusion mutuelle
          const estBloqueParExclusion = (talentId) => {
            const talent = talents[talentId];
            if (!talent || talentsActifs[talentId]) return false; // Si déjà actif, pas bloqué

            // Vérifier si ce talent exclut des talents actifs
            if (talent.exclusif && talent.exclusif.length > 0) {
              const bloqueParSesExclusions = talent.exclusif.some(exclusId => talentsActifs[exclusId]);
              if (bloqueParSesExclusions) return true;
            }

            // Vérifier si d'autres talents actifs excluent celui-ci (réciprocité)
            const bloqueParAutreTalent = Object.keys(talentsActifs).some(activeId => {
              const activeTalent = talents[activeId];
              return activeTalent?.exclusif && activeTalent.exclusif.includes(talentId);
            });

            return bloqueParAutreTalent;
          };

          // Vérifier si un talent est remplacé par un autre talent actif
          const estRemplace = (talentId) => {
            // Chercher si un talent actif remplace celui-ci
            return Object.keys(talentsActifs).some(activeId => {
              const activeTalent = talents[activeId];
              return activeTalent?.remplace === talentId;
            });
          };

          // Vérifier si un talent automatique est remplacé
          const estTalentAutoRemplace = (autoId) => {
            return Object.keys(talentsActifs).some(activeId => {

          // Obtenir le nom du talent qui bloque (pour tooltip)
          const getTalentBloquant = (talentId) => {

            if (talent?.exclusif && talent.exclusif.length > 0) {
              const bloquantId = talent.exclusif.find(exclusId => talentsActifs[exclusId]);
              if (bloquantId) return talents[bloquantId]?.nom;

            const bloquantId = Object.keys(talentsActifs).find(activeId => {
              const activeTalent = talents[activeId];
              return activeTalent?.exclusif && activeTalent.exclusif.includes(talentId);

            return bloquantId ? talents[bloquantId]?.nom : null;

            if (talentsActifs[talentId]) return true;

            // Bloqué par exclusion mutuelle
            if (estBloqueParExclusion(talentId)) return false;

            // Au moins un prérequis doit être rempli (OU logique), ou aucun prérequis
            const prerequisRemplis = talent.prerequis.length === 0 || talent.prerequis.some(prereq => talentsActifs[prereq]);
            return prerequisRemplis && pointsDisponibles >= talent.cout;

          // Ajouter un nouveau talent

          // Drag & Drop
          const handleDragStart = (e, talentId) => {
            if (!modeEdition) return;
            setDraggingTalent(talentId);

            // Capturer l'offset entre la souris et le coin supérieur gauche du talent
            const rect = e.currentTarget.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            setDragOffset({ x: offsetX, y: offsetY });

            e.dataTransfer.effectAllowed = 'move';
          };

          const handleDragEnd = () => {
            // Réinitialiser les états si le drag est annulé
            setDraggingTalent(null);
            setDragOffset(null);
            setTargetGridPoint(null);
          };

          const handleDragOver = (e) => {
            if (!modeEdition || !draggingTalent || !dragOffset) return;
            e.preventDefault();

            // Calculer où sera le coin supérieur gauche du talent
            const rect = e.currentTarget.getBoundingClientRect();
            // Prendre en compte le zoom dans les calculs
            // Position de la souris moins l'offset de clic moins le padding du container (32px = p-8)
            let x = (e.clientX - rect.left) / zoom - dragOffset.x / zoom - 32;
            let y = (e.clientY - rect.top) / zoom - dragOffset.y / zoom - 32;

            // Trouver la position X la plus proche
            let closestX = gridColumns[0];
            let minDistX = Math.abs(x - closestX);
            gridColumns.forEach(col => {
              const dist = Math.abs(x - col);
              if (dist < minDistX) {
                minDistX = dist;
                closestX = col;
              }
            });

            // Trouver la position Y la plus proche
            let closestY = gridRows[0];
            let minDistY = Math.abs(y - closestY);
            gridRows.forEach(row => {
              const dist = Math.abs(y - row);
              if (dist < minDistY) {
                minDistY = dist;
                closestY = row;
              }
            });

            // Mettre à jour le point cible
            setTargetGridPoint({ x: closestX, y: closestY });
          };

          const handleDrop = (e) => {

            e.preventDefault();

            // Utiliser le point cible calculé pendant le drag
            setTalents(prev => ({
              ...prev,
              [draggingTalent]: {
                ...prev[draggingTalent],
                position: { x: targetGridPoint.x, y: targetGridPoint.y }
              }
            }));

            // Réinitialiser les états de drag
            setDraggingTalent(null);
            setTargetGridPoint(null);
          };

          // Exporter l'arbre actuel en JSON
          const exporterArbreActuel = () => {
            if (arbreActuel === 'Informations') {
              alert('⚠️ Impossible d\'exporter la page Accueil. Sélectionnez une classe.');
              return;
            }

            const dataToExport = {
              classe: arbreActuel,
              talents: talents,
              version: '5.0',
              exportDate: new Date().toISOString()
            };

            const jsonString = JSON.stringify(dataToExport, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `arbre_${arbreActuel}_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showNotification(`✅ Arbre "${arbreActuel}" exporté !`);
          };

          // Importer un arbre depuis JSON
          const importerArbre = () => {
            if (arbreActuel === 'Informations') {
              alert('⚠️ Impossible d\'importer sur la page Accueil. Sélectionnez une classe.');
              return;
            }

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';

            input.onchange = (e) => {
              const file = e.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = (event) => {
                try {
                  const importedData = JSON.parse(event.target.result);

                  // Vérifier que c'est un format valide
                  if (!importedData.talents || !importedData.classe) {
                    alert('⚠️ Format de fichier invalide. Assurez-vous d\'importer un fichier exporté depuis cette application.');
                    return;
                  }

                  // Confirmer avant d'écraser
                  if (!confirm(`⚠️ Cela va écraser l'arbre actuel "${arbreActuel}" avec les données de "${importedData.classe}".\n\nVoulez-vous continuer ?`)) {
                    return;
                  }

                  // Importer les talents
                  setTalents(importedData.talents);

                  // Sauvegarder dans localStorage
                  localStorage.setItem(`classe_${arbreActuel}`, JSON.stringify({
                    talents: importedData.talents
                  }));

                  showNotification(`✅ Arbre importé avec succès ! ${Object.keys(importedData.talents).length} talents chargés.`);
                } catch (error) {
                  console.error('Erreur lors de l\'import:', error);
                  alert('❌ Erreur lors de la lecture du fichier. Vérifiez que c\'est un fichier JSON valide.');
                }
              };

              reader.readAsText(file);
            };

            input.click();
          };

          // Générer lien de partage pour les joueurs (Firebase Storage)
          const genererLienPartage = async () => {
            try {
              // Vérifier que Firebase est disponible
              if (!window.firebaseDB) {
                alert('⚠️ Firebase n\'est pas initialisé. Veuillez recharger la page.');
                return;
              }

              // Récupérer TOUTES les classes depuis localStorage
              const classes = {};
              let totalTalents = 0;

              CLASSES.forEach(classe => {
                const savedData = localStorage.getItem(`classe_${classe}`);
                if (savedData) {
                  const data = JSON.parse(savedData);

                  // Filtrer les talents cachés
                  const talentsVisibles = {};
                  Object.keys(data.talents || {}).forEach(id => {
                    const talent = data.talents[id];
                    if (talent.visible !== false) {
                      talentsVisibles[id] = talent;
                    }
                  });

                  // Récupérer les marqueurs pour cette classe
                  const savedMarqueurs = localStorage.getItem(`marqueurs_${classe}`);
                  const marqueurs = savedMarqueurs ? JSON.parse(savedMarqueurs) : {};

                  classes[classe] = {
                    talents: talentsVisibles,
                    nomPersonnage: data.nomPersonnage || '',
                    niveau: data.niveau || 1,
                    marqueurs: marqueurs
                  };

                  totalTalents += Object.keys(talentsVisibles).length;
                }
              });

              // Récupérer la page Informations si elle existe
              const pageInfo = localStorage.getItem('pageInfo') || '';

              // Créer le snapshot avec TOUTES les classes
              const snapshot = {
                version: '5.0', // Version 5.0 : multi-classes
                date: Date.now(),
                classes: classes,
                classeActive: arbreActuel, // La classe actuellement affichée par le GM
                pageInfo: pageInfo, // Page d'informations/consignes pour les joueurs
                motsClesCustom: motsClesCustom, // Mots-clés custom pour l'index
                iconesDisponibles: iconesDisponibles // Icônes PNG custom
              };

              console.log('📦 Création du snapshot multi-classes...', {
                nombreClasses: Object.keys(classes).length,
                totalTalents: totalTalents,
                classeActive: arbreActuel
              });

              // Générer un ID unique
              const id = crypto.randomUUID();

              // Sauvegarder dans Firestore
              console.log('☁️ Sauvegarde vers Firestore...');
              const docRef = window.firebaseDoc(window.firebaseDB, 'snapshots', id);
              await window.firebaseSetDoc(docRef, snapshot);
              console.log('✅ Sauvegarde réussie !');

              // Construire l'URL avec l'ID
              const baseUrl = window.location.origin + window.location.pathname;
              const url = `${baseUrl}#snapshot=${id}`;

              console.log('🔗 URL générée:', url);

              // Copier dans le presse-papier
              await navigator.clipboard.writeText(url);

              // Afficher le succès
              alert(`✅ Lien copié dans le presse-papier !\n\n🔗 ${url}\n\nClasses partagées : ${Object.keys(classes).length}\nTotal talents : ${totalTalents}\n\nLes joueurs pourront choisir leur classe et activer les talents.`);

              // Ouvrir dans un nouvel onglet
              window.open(url, '_blank');

            } catch (error) {
              console.error('❌ Erreur lors de la publication:', error);
              alert(`⚠️ Erreur lors de la publication du snapshot :\n\n${error.message}\n\nVérifiez la console pour plus de détails.`);

          };

          return (

                                          className="text-slate-200 text-xs leading-tight"
                                          style={{ whiteSpace: 'pre-line' }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.notes) }}
                                        />
                                      </div>
                                    )}

                                    {/* Contenu texte avec overflow contrôlé */}
                                    <div className="w-full h-full flex flex-col items-center justify-center overflow-hidden">
                                      {isGrandCarre(talent) && (
                                        <>
                                          <div className="text-white font-bold mb-1 text-center line-clamp-2" style={{ fontSize: `${getDynamicFontSize(talent.nom, 1.3, dimensions.width - 20)}rem` }}>
                                            {talent.nom}
                                          </div>
                                          <div
                                            className="text-slate-200 font-bold text-center leading-tight line-clamp-7"
                                            style={{ whiteSpace: 'pre-line', fontSize: `${getDynamicFontSize(talent.description, 0.9375, dimensions.width - 20)}rem` }}
                                            dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                          />
                                        </>
                                      )}

                                      {isRectangle(talent) && (
                                        <div
                                          className="text-slate-200 font-bold text-center leading-tight line-clamp-3"
                                          style={{ whiteSpace: 'pre-line', fontSize: `${getDynamicFontSize(talent.description, 0.9375, dimensions.width - 20)}rem` }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                        />
                                      )}

                                      {isPetitCarre(talent) && (
                                        <div
                                          className="text-slate-200 font-bold text-center leading-tight line-clamp-3"
                                          style={{ whiteSpace: 'pre-line', fontSize: `${getDynamicFontSize(talent.description, 0.9375, dimensions.width - 20)}rem` }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                        />
                                      )}
                                    </div>
                                  </button>

                                  {/* Boutons d'édition */}
                                  {modeEdition && (
                                    <div className="absolute -bottom-8 left-0 right-0 flex gap-1 justify-center no-print">
                                      <button
                                        onClick={() => {
                                          sauvegarderTalent(talent.id, {
                                            visible: !talent.visible
                                          });
                                        }}
                                        className={`px-2 py-1 ${talent.visible !== false ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-600 hover:bg-gray-700'} text-white rounded text-xs`}
                                        title={talent.visible !== false ? "Talent visible - Cliquer pour masquer" : "Talent masqué - Cliquer pour afficher"}
                                      >
                                        {talent.visible !== false ? '👁️' : '👁️‍🗨️'}
                                      </button>
                                      <button
                                        onClick={() => setEditingTalent(talent.id)}
                                        className="px-2 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs"
                                      >
                                        ✏️
                                      </button>
                                      <button
                                        onClick={() => dupliquerTalent(talent.id)}
                                        className="px-2 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-xs"
                                      >
                                        📋
                                      </button>
                                      <button
                                        onClick={() => supprimerTalent(talent.id)}
                                        className="px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs"
                                      >
                                        🗑️
                                      </button>
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                      </div>
                  </div>
                  </>
                )}
                  </>
                )}

                {/* Vue Feuille de personnage */}
                {vueActive === 'feuille' && arbreActuel !== 'Informations' && (
                  <div className="bg-white rounded-b-lg p-4 shadow-2xl text-black print-feuille">
                    <h2 className="text-2xl font-bold mb-3 text-center border-b-2 border-amber-500 pb-2">
                      Feuille de Personnage
                    </h2>

                    {/* Caractéristiques du personnage */}
                    <div className={`mb-4 p-3 ${modePrint ? 'bg-white' : 'bg-slate-100'} border-2 border-slate-300 rounded`}>
                      {/* Infos de base */}
                      <div className="flex flex-wrap items-center gap-4 text-sm mb-3 pb-3 border-b border-slate-300">
                        <div className="flex items-center gap-2">
                          <span className="font-bold">NOM :</span>
                          <span className="px-2 py-1 rounded font-bold text-white uppercase" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {nomPersonnage || '(Non défini)'}
                          </span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold">CLASSE :</span>
                          <span className="px-2 py-1 rounded font-bold text-white uppercase" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {arbreActuel}
                          </span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold">NIVEAU :</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {niveau}
                          </span>
                        </div>
                      </div>

                      {/* Stats : DÉGÂTS, PV, formule */}
                      <div className="flex flex-wrap items-center gap-3 text-sm mb-3 pb-3 border-b border-slate-300">
                        <div className="flex items-center gap-2">
                          <span className="font-bold">DÉGÂTS</span>
                          <span className="px-2 py-1 rounded font-bold text-white min-w-[70px] text-center" style={{ backgroundColor: couleursTalent.degats.code }}>
                            +{getTotalDegats()}
                          </span>
                        </div>
                        <div className="h-6 border-l-2 border-slate-400"></div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold">PV</span>
                          <span className="px-2 py-1 bg-green-700 text-white rounded font-bold min-w-[70px] text-center">
                            {getPointsDeVie()}
                          </span>
                          <span className="font-bold">=</span>
                          <span className="font-bold">VIE</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: couleursTalent.vie.code }}>
                            {getTotalVie()}
                          </span>
                          <span className="font-bold">×</span>
                          <span className="font-bold">ENDU</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: couleursTalent.endu.code }}>
                            {getTotalEndu()}
                          </span>
                          <span className="font-bold">+</span>
                          <span className="font-bold">BONUS</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {getBonusPV()}
                          </span>
                        </div>
                      </div>

                      {/* Compétences sur une seule ligne */}
                      {getCompetencesActives().length > 0 && (
                        <div className="flex flex-wrap items-center gap-3 text-sm">
                          {getCompetencesActives().map(comp => (
                            <div key={comp} className="flex items-center gap-2">
                              <span className="font-bold">{comp}</span>
                              <span className="px-2 py-1 bg-orange-600 text-white rounded font-bold">
                                +{getTotalCompetence(comp)}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Récapitulatif compact */}
                    <div className="mb-3 p-2 bg-amber-50 border border-amber-500 rounded flex justify-between text-sm">
                      <span><strong>Points:</strong> {pointsMax - pointsDisponibles}/{pointsMax}</span>
                      <span><strong>Talents:</strong> {Object.keys(talentsActifs).length}</span>
                      <span><strong>Bonus:</strong> {Object.entries(talentsActifs).filter(([id]) => talents[id]?.bonus).length}</span>
                    </div>

                    {/* Talents actifs groupés par type */}
                    <div className="flex gap-6">
                        {/* Colonne gauche */}
                        <div className="flex-1 flex flex-col gap-6">
                          {['action', 'passif', 'maitrise']
                            .map(typeKey => {
                              const typeInfo = couleursTalent[typeKey];
                              if (!typeInfo) return null;
                              const talentsDeCeType = Object.entries(talentsActifs).filter(([id]) => {
                                const talent = talents[id];
                                // Exclure les talents remplacés par une version améliorée
                                return talent?.couleurTalent === typeKey && !estRemplace(id);
                              }).sort((a, b) => {
                                // Tri alphabétique par nom de talent
                                const talentA = talents[a[0]];
                                const talentB = talents[b[0]];
                                return talentA.nom.localeCompare(talentB.nom);
                              });

                              // Pour les actions, toujours afficher si Attaque n'est pas remplacée
                              // Pour les autres, ne rien afficher si aucun talent
                              if (talentsDeCeType.length === 0 && typeKey === 'action' && estTalentAutoRemplace('auto_attaque')) return null;
                              if (talentsDeCeType.length === 0 && typeKey !== 'action') return null;

                              return (
                                <div key={typeKey}>
                                  <h3 className="text-lg font-bold mb-3 pb-1 border-b border-slate-300" style={{ color: typeInfo.code }}>
                                    {typeInfo.nom}
                                  </h3>
                                  <div className="grid grid-cols-2 gap-3">
                                    {/* Attaque - automatique pour tous (sauf si remplacée) */}
                                    {typeKey === 'action' && !estTalentAutoRemplace('auto_attaque') && (
                                      <div
                                        key="attaque-base"
                                        className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                      >
                                        {/* Titre en couleur */}
                                        <div className="font-bold text-left mb-1" style={{ color: couleursTalent.action.code, fontSize: '0.95rem' }}>
                                          Attaque
                                        </div>

                                        {/* Description alignée à gauche */}
                                        <div
                                          className="text-slate-700 text-left leading-tight"
                                          style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers(`Vous effectuez <b>1 attaque</b>\n(<b>Arme</b> + <b>{DEGATS} dégâts</b>)`) }}
                                        />
                                      </div>
                                    )}

                                    {talentsDeCeType.map(([id]) => {
                                      const talent = talents[id];
                                      const couleur = getCouleurTalent(talent);

                                      return (
                                        <div
                                          key={id}
                                          className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                        >
                                          {/* Titre en couleur */}
                                          <div className="font-bold text-left mb-1" style={{ color: couleur, fontSize: '0.95rem' }}>
                                            {talent.nom}
                                          </div>

                                          {/* Description alignée à gauche */}
                                          <div
                                            className="text-slate-700 text-left leading-tight"
                                            style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                            dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                          />
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                        </div>

                        {/* Colonne droite */}
                        <div className="flex-1 flex flex-col gap-6">
                          {['reaction', 'amelioration', 'aventure']
                            .map(typeKey => {
                              const typeInfo = couleursTalent[typeKey];
                              if (!typeInfo) return null;
                              const talentsDeCeType = Object.entries(talentsActifs).filter(([id]) => {
                                const talent = talents[id];
                                // Exclure les talents remplacés par une version améliorée
                                return talent?.couleurTalent === typeKey && !estRemplace(id);
                              }).sort((a, b) => {
                                // Tri alphabétique par nom de talent
                                const talentA = talents[a[0]];
                                const talentB = talents[b[0]];
                                return talentA.nom.localeCompare(talentB.nom);
                              });

                              // Pour les réactions, toujours afficher si Dégâts d'Opportunité n'est pas remplacée
                              // Pour les autres, ne rien afficher si aucun talent
                              if (talentsDeCeType.length === 0 && typeKey === 'reaction' && estTalentAutoRemplace('auto_degats_opportunite')) return null;
                              if (talentsDeCeType.length === 0 && typeKey !== 'reaction') return null;

                              return (
                                <div key={typeKey}>
                                  <h3 className="text-lg font-bold mb-3 pb-1 border-b border-slate-300" style={{ color: typeInfo.code }}>
                                    {typeInfo.nom}
                                  </h3>
                                  <div className="grid grid-cols-2 gap-3">
                                    {/* Dégâts d'Opportunité - automatique pour tous (sauf si remplacée) */}
                                    {typeKey === 'reaction' && !estTalentAutoRemplace('auto_degats_opportunite') && (
                                      <div
                                        key="degats-opportunite"
                                        className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                      >
                                        {/* Titre en couleur */}
                                        <div className="font-bold text-left mb-1" style={{ color: couleursTalent.reaction.code, fontSize: '0.95rem' }}>
                                          Dégâts d'Opportunité
                                        </div>

                                        {/* Description alignée à gauche */}
                                        <div
                                          className="text-slate-700 text-left leading-tight"
                                          style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers('<i>Quand un adversaire quitte votre contact,</i>\n\nVous lui infligez <b>{DEGATS} dégâts</b>') }}
                                        />
                                      </div>
                                    )}

                                    {talentsDeCeType.map(([id]) => {
                                      const talent = talents[id];
                                      const couleur = getCouleurTalent(talent);

                                      return (
                                        <div
                                          key={id}
                                          className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                        >
                                          {/* Titre en couleur */}
                                          <div className="font-bold text-left mb-1" style={{ color: couleur, fontSize: '0.95rem' }}>
                                            {talent.nom}
                                          </div>

                                          {/* Description alignée à gauche */}
                                          <div
                                            className="text-slate-700 text-left leading-tight"
                                            style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                            dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                          />
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                        </div>
                      </div>

                      {/* Index des mots-clés - afficher uniquement ceux des talents actifs */}
                      {(() => {
                        // Collecter tous les mots-clés des talents actifs
                        const motsClesActifs = new Set();
                        Object.keys(talentsActifs).forEach(id => {
                          const talent = talents[id];
                          console.log('🔍 Vérification talent actif:', id, 'motsCles:', talent?.motsCles);
                          if (talent?.motsCles) {
                            talent.motsCles.forEach(cle => motsClesActifs.add(cle));
                          }
                        });

                        console.log('📋 Mots-clés actifs collectés:', Array.from(motsClesActifs));

                        // Filtrer l'index pour n'afficher que les mots-clés présents
                        const indexFiltre = Object.entries(getTousMotsCles()).filter(([cle]) => motsClesActifs.has(cle));

                        console.log('📄 Index filtré:', indexFiltre);

                        // N'afficher l'index que s'il y a au moins un mot-clé
                        if (indexFiltre.length === 0) return null;

                        return (
                          <div className="mt-6 pt-4 border-t-2 border-amber-500">
                            <h3 className="text-sm font-bold mb-2 text-amber-700">Index</h3>
                            <div className="space-y-1">
                              {indexFiltre.map(([cle, info]) => (
                                <div key={cle} className="text-xs">
                                  <span className="font-bold">{info.titre} :</span>
                                  <span className="ml-2 text-slate-700" dangerouslySetInnerHTML={{ __html: replaceMarkers(info.definition) }} />
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })()}
                  </div>
                )}
                  </>
                )}
              </div>
            </div>
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArbreTalents />);
    </script>
</body>
</html>
