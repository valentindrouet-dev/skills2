<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Talents</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }

        /* Styles pour l'impression */
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
            }

            /* A4 portrait pour l'arbre */
            @page arbre {
                size: A4 portrait;
                margin: 0.5cm;
            }

            /* A4 paysage pour la feuille */
            @page feuille {
                size: A4 landscape;
                margin: 0.5cm;
            }

            .print-page-break {
                page-break-after: always;
            }

            .print-talent-tree {
                background: white !important;
                padding: 10px;
                max-width: 100%;
                overflow: hidden;
                page: arbre;
                transform: scale(0.45) !important;
                transform-origin: top left !important;
                width: 220% !important;
                height: 220% !important;
            }

            .print-talent {
                border: 2px solid #333 !important;
                box-shadow: none !important;
                transform: none !important;
                opacity: 1 !important;
            }

            /* Talents non actifs : fond blanc */
            .print-talent:not(.active) {
                background: white !important;
            }

            /* Talents actifs : garder les couleurs */
            .print-talent.active {
                border-color: #000 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Masquer les badges pour l'impression */
            .print-talent > div:first-child {
                opacity: 0.8;
            }

            /* Styles pour la feuille de perso */
            .print-feuille {
                page: feuille;
                transform: scale(0.75) !important;
                transform-origin: top left !important;
            }

            .bg-white {
                background: white !important;
            }
        }

        .dragging {
            opacity: 0.5;
            cursor: move;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons
        const Info = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
        );

        const Edit = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        );

        const Download = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const Upload = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        );

        const Share = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
        );

        const Printer = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
        );

        function ArbreTalents() {
          // Grille de placement : points d'ancrage tous les 20px
          // Génère automatiquement les points de 0 à 1340 (68 colonnes) et 0 à 1200 (61 lignes)
          const gridColumns = Array.from({ length: 68 }, (_, i) => i * 20); // [0, 20, 40, 60, ..., 1340]
          const gridRows = Array.from({ length: 61 }, (_, i) => i * 20); // [0, 20, 40, 60, ..., 1200]

          // Ref pour éviter la sauvegarde automatique au premier rendu
          const isInitialMount = React.useRef(true);

          // États pour la gestion des arbres GM
          const [arbreActuel, setArbreActuel] = useState('Arbre par défaut');
          const [arbresDisponibles, setArbresDisponibles] = useState(['Arbre par défaut']);
          const [nomArbrePartage, setNomArbrePartage] = useState(''); // Nom de l'arbre partagé (PJ)

          const [pointsDisponibles, setPointsDisponibles] = useState(10);
          const [pointsMax, setPointsMax] = useState(10);
          const [talentsActifs, setTalentsActifs] = useState({});
          const [hoveredTalent, setHoveredTalent] = useState(null);
          const [modeEdition, setModeEdition] = useState(false);
          const [vueActive, setVueActive] = useState('arbre'); // 'arbre' ou 'feuille'
          const [zoom, setZoom] = useState(1); // Zoom level: 0.5 à 1.5

          const talentsParDefaut = {
            vie1: {
              id: 'vie1',
              nom: 'Vitalité',
              cout: 1,
              bonus: 'Vie +1',
              description: 'Augmente vos points de vie de 1',
              position: { x: 0, y: 0 },
              prerequis: [],
              categorie: 'vie',
              typeTalent: 'grand_carre', // grand_carre (200x200), rectangle (200x100), petit_carre (100x100)
              couleurTalent: 'action' // action, amelioration, passif
            },
            alchimiste1: {
              id: 'alchimiste1',
              nom: 'Alchimiste : Artificier',
              cout: 2,
              bonus: 'Endu +2',
              description: 'Vous débutez chaque combat avec 1 grenade qui inflige des dégâts à tous les combattants en petit rayon',
              position: { x: 250, y: 0 },
              prerequis: ['vie1'],
              categorie: 'combat',
              typeTalent: 'grand_carre',
              couleurTalent: 'action'
            },
            analyse: {
              id: 'analyse',
              nom: 'Analyse Standard',
              cout: 1,
              bonus: '',
              description: 'Sans mouvement, vous effectuez 1 analyse standard',
              position: { x: 500, y: 0 },
              prerequis: ['alchimiste1'],
              categorie: 'analyse',
              typeTalent: 'grand_carre',
              couleurTalent: 'action'
            },
            alchimiste2: {
              id: 'alchimiste2',
              nom: 'Alchimiste : Apothicaire',
              cout: 2,
              bonus: 'Endu +2',
              description: 'Vous débutez chaque combat avec 1 infusion qui soigne un allié en contact',
              position: { x: 750, y: 0 },
              prerequis: ['analyse'],
              categorie: 'soin',
              typeTalent: 'grand_carre',
              couleurTalent: 'action'
            },
            vie2: {
              id: 'vie2',
              nom: 'Vitalité II',
              cout: 1,
              bonus: 'Vie +1',
              description: 'Augmente vos points de vie de 1 supplémentaire',
              position: { x: 1000, y: 0 },
              prerequis: ['alchimiste2'],
              categorie: 'vie',
              typeTalent: 'grand_carre',
              couleurTalent: 'action'
            }
          };

          const [talents, setTalents] = useState(talentsParDefaut);
          const [editingTalent, setEditingTalent] = useState(null);
          const [draggingTalent, setDraggingTalent] = useState(null);
          const [dragOffset, setDragOffset] = useState(null); // Offset entre la souris et le coin sup gauche du talent
          const [targetGridPoint, setTargetGridPoint] = useState(null); // Point d'ancrage cible pendant le drag
          const [modeLectureSeule, setModeLectureSeule] = useState(false);

          const categories = {
            vie: { couleur: 'bg-orange-600', nom: 'Vie' },
            combat: { couleur: 'bg-blue-600', nom: 'Combat' },
            analyse: { couleur: 'bg-purple-600', nom: 'Analyse' },
            soin: { couleur: 'bg-green-600', nom: 'Soin' }
          };

          // Types de talents et leurs dimensions
          const typesTalent = {
            grand_carre: { width: 200, height: 200, nom: 'Grand Carré' },
            rectangle: { width: 200, height: 80, nom: 'Rectangle' },
            petit_carre: { width: 80, height: 80, nom: 'Petit Carré' },
            // Compatibilité anciens noms
            action: { width: 200, height: 200, nom: 'Grand Carré' },
            passif: { width: 200, height: 80, nom: 'Rectangle' },
            bonus: { width: 80, height: 80, nom: 'Petit Carré' }
          };

          // Couleurs de talents
          const couleursTalent = {
            action: { code: '#496f93', nom: 'Action' },
            amelioration: { code: '#4e8b51', nom: 'Amélioration' },
            degats: { code: '#ac6060', nom: 'Dégâts' },
            endu: { code: '#6ec5bc', nom: 'Endu' },
            maitrise: { code: '#d5b15a', nom: 'Maîtrise' },
            passif: { code: '#999999', nom: 'Passif' },
            reaction: { code: '#7d5f92', nom: 'Réaction' }
          };

          // Helper pour obtenir les dimensions d'un talent
          const getDimensionsTalent = (talent) => {
            const type = talent?.typeTalent || 'grand_carre'; // Par défaut: Grand Carré
            return typesTalent[type] || typesTalent.grand_carre;
          };

          // Helper pour obtenir la couleur d'un talent
          const getCouleurTalent = (talent) => {
            const couleur = talent?.couleurTalent || 'action'; // Par défaut: action
            return couleursTalent[couleur]?.code || couleursTalent.action.code;
          };

          // Helper pour calculer la hauteur nécessaire de l'interface
          const getRequiredHeight = () => {
            if (Object.keys(talents).length === 0) return 800;

            let maxY = 800; // Hauteur minimale
            Object.values(talents).forEach(talent => {
              const dim = getDimensionsTalent(talent);
              const talentBottom = talent.position.y + dim.height + 150; // +150 pour marge
              if (talentBottom > maxY) maxY = talentBottom;
            });

            return maxY;
          };

          // Helper pour calculer la largeur nécessaire de l'interface
          const getRequiredWidth = () => {
            if (Object.keys(talents).length === 0) return 1300;

            let maxX = 1000; // Largeur minimale
            Object.values(talents).forEach(talent => {
              const dim = getDimensionsTalent(talent);
              const talentRight = talent.position.x + dim.width + 150; // +150 pour marge
              if (talentRight > maxX) maxX = talentRight;
            });

            return maxX;
          };

          // ========== GESTION DE LA SAUVEGARDE GM ==========

          // Sauvegarder automatiquement l'arbre actuel
          useEffect(() => {
            // Sauter la sauvegarde au premier rendu pour éviter d'écraser le dernier arbre actif
            if (isInitialMount.current) {
              isInitialMount.current = false;
              return;
            }

            if (!modeLectureSeule) {
              const arbreData = {
                talents,
                talentsActifs,
                pointsDisponibles,
                pointsMax
              };
              localStorage.setItem(`arbre_${arbreActuel}`, JSON.stringify(arbreData));
              // Sauvegarder également quel arbre est actif
              localStorage.setItem('dernierArbreActif', arbreActuel);
              console.log('💾 Sauvegarde automatique:', arbreActuel);
            }
          }, [talents, talentsActifs, pointsDisponibles, pointsMax, arbreActuel, modeLectureSeule]);

          // Charger la liste des arbres sauvegardés au démarrage
          useEffect(() => {
            const savedTrees = [];
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              if (key.startsWith('arbre_')) {
                savedTrees.push(key.replace('arbre_', ''));
              }
            }
            if (savedTrees.length > 0) {
              setArbresDisponibles(savedTrees);
            } else {
              // Sauvegarder l'arbre par défaut s'il n'y en a pas
              const defaultData = {
                talents: talentsParDefaut,
                talentsActifs: {},
                pointsDisponibles: 10,
                pointsMax: 10
              };
              localStorage.setItem('arbre_Arbre par défaut', JSON.stringify(defaultData));
            }
          }, []);

          // Charger un arbre
          const chargerArbre = (nomArbre) => {
            const savedData = localStorage.getItem(`arbre_${nomArbre}`);
            if (savedData) {
              const data = JSON.parse(savedData);
              setTalents(data.talents || talentsParDefaut);
              setTalentsActifs(data.talentsActifs || {});
              setPointsDisponibles(data.pointsDisponibles || 10);
              setPointsMax(data.pointsMax || 10);
              setArbreActuel(nomArbre);
              console.log('📂 Arbre chargé:', nomArbre);
            }
          };

          // Créer un nouvel arbre
          const nouvelArbre = () => {
            const nom = prompt('Nom du nouvel arbre de talents :');
            if (nom && nom.trim()) {
              const newData = {
                talents: talentsParDefaut,
                talentsActifs: {},
                pointsDisponibles: 10,
                pointsMax: 10
              };
              localStorage.setItem(`arbre_${nom}`, JSON.stringify(newData));
              setArbresDisponibles(prev => [...prev, nom]);
              chargerArbre(nom);
            }
          };

          // Renommer l'arbre actuel
          const renommerArbre = () => {
            const nouveauNom = prompt('Nouveau nom pour cet arbre :', arbreActuel);
            if (nouveauNom && nouveauNom.trim() && nouveauNom !== arbreActuel) {
              // Copier les données
              const data = localStorage.getItem(`arbre_${arbreActuel}`);
              localStorage.setItem(`arbre_${nouveauNom}`, data);
              localStorage.removeItem(`arbre_${arbreActuel}`);

              // Mettre à jour la liste
              setArbresDisponibles(prev => prev.map(a => a === arbreActuel ? nouveauNom : a));
              setArbreActuel(nouveauNom);
            }
          };

          // Dupliquer l'arbre actuel
          const dupliquerArbre = () => {
            const nom = prompt('Nom de la copie :', `${arbreActuel} (copie)`);
            if (nom && nom.trim()) {
              const data = localStorage.getItem(`arbre_${arbreActuel}`);
              localStorage.setItem(`arbre_${nom}`, data);
              setArbresDisponibles(prev => [...prev, nom]);
              alert(`✅ Arbre "${nom}" créé !`);
            }
          };

          // Supprimer l'arbre actuel
          const supprimerArbre = () => {
            if (arbresDisponibles.length <= 1) {
              alert('❌ Vous ne pouvez pas supprimer le dernier arbre !');
              return;
            }
            if (confirm(`Supprimer l'arbre "${arbreActuel}" ?`)) {
              localStorage.removeItem(`arbre_${arbreActuel}`);
              const nouveauxArbres = arbresDisponibles.filter(a => a !== arbreActuel);
              setArbresDisponibles(nouveauxArbres);
              chargerArbre(nouveauxArbres[0]);
            }
          };

          // Charger l'arbre actuel au démarrage de la Page GM
          useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const dataParam = params.get('data');

            if (!dataParam) {
              // Page GM - Charger le dernier arbre utilisé
              const dernierArbre = localStorage.getItem('dernierArbreActif') || 'Arbre par défaut';
              console.log('🔄 Chargement du dernier arbre actif:', dernierArbre);
              chargerArbre(dernierArbre);
            }
          }, []); // Uniquement au démarrage

          // ========== FIN GESTION SAUVEGARDE ==========

          // Charger depuis l'URL au démarrage (Pages PJ)
          useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const dataParam = params.get('data');
            console.log('Paramètre data dans URL:', dataParam ? 'Présent' : 'Absent');

            if (dataParam) {
              try {
                console.log('Décodage du paramètre data...');
                // Décoder Base64 avec support Unicode
                const jsonString = decodeURIComponent(escape(atob(dataParam)));
                const decoded = JSON.parse(jsonString);
                console.log('Données décodées:', decoded);
                console.log('Talents chargés:', decoded.talents);
                console.log('Nombre de talents chargés:', Object.keys(decoded.talents || {}).length);

                if (decoded.talents) {
                  setTalents(decoded.talents);
                  console.log('✅ Talents mis à jour avec les données partagées');
                }
                if (decoded.pointsMax) {
                  setPointsMax(decoded.pointsMax);
                  setPointsDisponibles(decoded.pointsMax);
                }
                if (decoded.nomArbre) setNomArbrePartage(decoded.nomArbre);
                setModeLectureSeule(true); // Mode lecture seule pour les liens partagés
                console.log('🔒 Mode lecture seule activé');
              } catch (e) {
                console.error('❌ Erreur lors du chargement depuis l\'URL', e);
              }
            } else {
              console.log('📝 Aucune donnée partagée - Mode normal');
            }
          }, []);

          // Trouver tous les talents qui dépendent d'un talent donné (récursif)
          const findDependentTalents = (talentId, currentActifs) => {
            const dependents = [];

            // Trouver les talents qui ont talentId comme prérequis et qui sont actifs
            Object.keys(currentActifs).forEach(id => {
              const talent = talents[id];
              if (talent && talent.prerequis.includes(talentId)) {
                dependents.push(id);
                // Récursion pour trouver les talents qui dépendent de celui-ci
                const subDependents = findDependentTalents(id, currentActifs);
                dependents.push(...subDependents);
              }
            });

            return dependents;
          };

          const toggleTalent = (talentId) => {
            if (modeEdition) return; // Pas d'activation en mode édition

            const talent = talents[talentId];

            if (talentsActifs[talentId]) {
              // Trouver tous les talents qui dépendent de celui-ci
              const dependents = findDependentTalents(talentId, talentsActifs);

              // Calculer le total des points à restituer
              let pointsToRestore = talent.cout;
              dependents.forEach(depId => {
                if (talents[depId]) {
                  pointsToRestore += talents[depId].cout;
                }
              });

              // Décocher le talent et tous ses dépendants
              setTalentsActifs(prev => {
                const newState = { ...prev };
                delete newState[talentId];
                dependents.forEach(depId => {
                  delete newState[depId];
                });
                return newState;
              });

              setPointsDisponibles(prev => prev + pointsToRestore);
            } else {
              // Au moins un prérequis doit être rempli (OU logique), ou aucun prérequis
              const prerequisRemplis = talent.prerequis.length === 0 || talent.prerequis.some(prereq => talentsActifs[prereq]);

              if (!prerequisRemplis) {
                alert('Vous devez d\'abord débloquer au moins un des talents prérequis !');
                return;
              }

              if (pointsDisponibles < talent.cout) {
                alert('Points insuffisants !');
                return;
              }

              setTalentsActifs(prev => ({ ...prev, [talentId]: true }));
              setPointsDisponibles(prev => prev - talent.cout);
            }
          };

          const peutEtreActive = (talentId) => {
            const talent = talents[talentId];
            // Au moins un prérequis doit être rempli (OU logique), ou aucun prérequis
            const prerequisRemplis = talent.prerequis.length === 0 || talent.prerequis.some(prereq => talentsActifs[prereq]);
            return prerequisRemplis && (talentsActifs[talentId] || pointsDisponibles >= talent.cout);
          };

          const resetTalents = () => {
            setTalentsActifs({});
            setPointsDisponibles(pointsMax);
          };

          // Fonction d'export en JSON
          const exportJSON = () => {
            const data = {
              talents,
              pointsMax: 10,
              talentsActifs,
              version: '1.0'
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'arbre-talents.json';
            a.click();
            URL.revokeObjectURL(url);
          };

          // Fonction d'import JSON
          const importJSON = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = JSON.parse(e.target.result);
                if (data.talents) setTalents(data.talents);
                if (data.talentsActifs) setTalentsActifs(data.talentsActifs);
                if (data.pointsMax) setPointsDisponibles(data.pointsMax);
                alert('Import réussi !');
              } catch (error) {
                alert('Erreur lors de l\'import du fichier');
              }
            };
            reader.readAsText(file);
          };

          // Générer URL de partage
          const genererLienPartage = async () => {
            // Déboguer : afficher l'état actuel
            console.log('État des talents au moment du partage:', talents);
            console.log('Nombre de talents:', Object.keys(talents).length);

            // S'assurer de capturer l'état actuel des talents avec toutes les modifications
            const talentsToShare = JSON.parse(JSON.stringify(talents)); // Deep copy
            const data = {
              talents: talentsToShare,
              pointsMax,
              version: '1.0',
              nomArbre: arbreActuel
            };

            console.log('Données à encoder:', data);

            const jsonString = JSON.stringify(data);
            // Encoder en Base64 avec support Unicode
            const encoded = btoa(unescape(encodeURIComponent(jsonString)));

            // Forcer l'URL vers talent-tree.html pour éviter la redirection de index.html
            const baseUrl = `${window.location.origin}${window.location.pathname}`;
            const targetUrl = baseUrl.endsWith('talent-tree.html')
              ? baseUrl
              : `${window.location.origin}${window.location.pathname.replace(/\/$/, '')}/talent-tree.html`;
            const url = `${targetUrl}?data=${encoded}`;

            console.log('URL générée:', url);
            console.log('Longueur de l\'URL:', url.length);

            // Copier dans le presse-papier
            try {
              await navigator.clipboard.writeText(url);
            } catch (err) {
              console.error('Erreur lors de la copie:', err);
            }

            // Ouvrir dans un nouvel onglet
            window.open(url, '_blank');
          };

          // Ajouter un nouveau talent
          const ajouterTalent = () => {
            const newId = `talent_${Date.now()}`;
            setTalents(prev => ({
              ...prev,
              [newId]: {
                id: newId,
                nom: 'Nouveau Talent',
                cout: 1,
                bonus: '',
                description: 'Description du talent',
                position: { x: 100, y: 300 },
                prerequis: [],
                categorie: 'vie',
                typeTalent: 'grand_carre',
                couleurTalent: 'action'
              }
            }));
            setEditingTalent(newId);
          };

          // Supprimer un talent
          const supprimerTalent = (talentId) => {
            if (!confirm('Voulez-vous vraiment supprimer ce talent ?')) return;

            setTalents(prev => {
              const newTalents = { ...prev };
              delete newTalents[talentId];

              // Retirer ce talent des prérequis des autres
              Object.keys(newTalents).forEach(id => {
                newTalents[id].prerequis = newTalents[id].prerequis.filter(p => p !== talentId);
              });

              return newTalents;
            });

            setTalentsActifs(prev => {
              const newState = { ...prev };
              delete newState[talentId];
              return newState;
            });
          };

          // Dupliquer un talent
          const dupliquerTalent = (talentId) => {
            const talent = talents[talentId];
            if (!talent) return;

            const newId = `talent_${Date.now()}`;
            setTalents(prev => ({
              ...prev,
              [newId]: {
                ...talent,
                id: newId,
                nom: talent.nom,
                position: {
                  x: talent.position.x + 40,  // Décalage de 40px
                  y: talent.position.y + 40
                },
                prerequis: [...talent.prerequis] // Copier les prérequis
              }
            }));
            setEditingTalent(newId);
          };

          // Sauvegarder les modifications d'un talent
          const sauvegarderTalent = (talentId, updates) => {
            setTalents(prev => ({
              ...prev,
              [talentId]: {
                ...prev[talentId],
                ...updates
              }
            }));
            setEditingTalent(null);
          };

          // Drag & Drop
          const handleDragStart = (e, talentId) => {
            if (!modeEdition) return;
            setDraggingTalent(talentId);

            // Capturer l'offset entre la souris et le coin supérieur gauche du talent
            const rect = e.currentTarget.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            setDragOffset({ x: offsetX, y: offsetY });

            e.dataTransfer.effectAllowed = 'move';
          };

          const handleDragEnd = () => {
            // Réinitialiser les états si le drag est annulé
            setDraggingTalent(null);
            setDragOffset(null);
            setTargetGridPoint(null);
          };

          const handleDragOver = (e) => {
            if (!modeEdition || !draggingTalent || !dragOffset) return;
            e.preventDefault();

            // Calculer où sera le coin supérieur gauche du talent
            const rect = e.currentTarget.getBoundingClientRect();
            // Position de la souris moins l'offset de clic moins le padding du container (32px = p-8)
            let x = e.clientX - rect.left - dragOffset.x - 32;
            let y = e.clientY - rect.top - dragOffset.y - 32;

            // Trouver la position X la plus proche
            let closestX = gridColumns[0];
            let minDistX = Math.abs(x - closestX);
            gridColumns.forEach(col => {
              const dist = Math.abs(x - col);
              if (dist < minDistX) {
                minDistX = dist;
                closestX = col;
              }
            });

            // Trouver la position Y la plus proche
            let closestY = gridRows[0];
            let minDistY = Math.abs(y - closestY);
            gridRows.forEach(row => {
              const dist = Math.abs(y - row);
              if (dist < minDistY) {
                minDistY = dist;
                closestY = row;
              }
            });

            // Mettre à jour le point cible
            setTargetGridPoint({ x: closestX, y: closestY });
          };

          const handleDrop = (e) => {
            if (!modeEdition || !draggingTalent || !targetGridPoint) return;
            e.preventDefault();

            // Utiliser le point cible calculé pendant le drag
            setTalents(prev => ({
              ...prev,
              [draggingTalent]: {
                ...prev[draggingTalent],
                position: { x: targetGridPoint.x, y: targetGridPoint.y }
              }
            }));

            // Réinitialiser les états de drag
            setDraggingTalent(null);
            setTargetGridPoint(null);
          };

          // Imprimer
          const imprimerArbre = () => {
            setVueActive('arbre');
            setTimeout(() => window.print(), 100);
          };

          const imprimerFeuille = () => {
            setVueActive('feuille');
            setTimeout(() => window.print(), 100);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 p-8">
              <div className="mx-auto" style={{ maxWidth: `${getRequiredWidth() + 64}px` }}>
                {/* Header */}
                <div className="bg-gradient-to-r from-amber-600 to-amber-500 rounded-t-lg p-6 shadow-lg no-print">
                  <h1 className="text-4xl font-bold text-center text-white tracking-wide">
                    Arbre de Talents {modeLectureSeule ? (nomArbrePartage ? `- ${nomArbrePartage}` : '(PJ)') : `(GM)`}
                  </h1>
                </div>

                {/* Gestion des Arbres GM - Visible uniquement pour le GM */}
                {!modeLectureSeule && (
                  <div className="bg-slate-750 border-x-2 border-amber-500 p-3 flex items-center gap-3 flex-wrap no-print" style={{ backgroundColor: '#334155' }}>
                    <span className="text-amber-400 font-semibold">📚 Arbre actuel:</span>
                    <select
                      value={arbreActuel}
                      onChange={(e) => chargerArbre(e.target.value)}
                      className="px-3 py-1.5 bg-slate-700 text-white rounded border border-slate-600 font-semibold"
                    >
                      {arbresDisponibles.map(arbre => (
                        <option key={arbre} value={arbre}>{arbre}</option>
                      ))}
                    </select>

                    <div className="flex gap-2">
                      <button
                        onClick={nouvelArbre}
                        className="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded text-sm font-semibold transition-colors"
                        title="Créer un nouvel arbre"
                      >
                        ➕ Nouveau
                      </button>
                      <button
                        onClick={dupliquerArbre}
                        className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-semibold transition-colors"
                        title="Dupliquer cet arbre"
                      >
                        📋 Dupliquer
                      </button>
                      <button
                        onClick={renommerArbre}
                        className="px-3 py-1.5 bg-yellow-600 hover:bg-yellow-700 text-white rounded text-sm font-semibold transition-colors"
                        title="Renommer cet arbre"
                      >
                        ✏️ Renommer
                      </button>
                      <button
                        onClick={supprimerArbre}
                        className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-semibold transition-colors"
                        title="Supprimer cet arbre"
                      >
                        🗑️ Supprimer
                      </button>
                    </div>
                  </div>
                )}

                {/* Barre d'outils */}
                <div className={`bg-slate-800 ${modeLectureSeule ? 'border-2' : 'border-x-2'} border-amber-500 p-4 flex justify-between items-center flex-wrap gap-4 no-print`}>
                  <div className="flex gap-2 flex-wrap">
                    <button
                      onClick={() => setVueActive('arbre')}
                      className={`px-4 py-2 rounded font-semibold transition-colors ${
                        vueActive === 'arbre' ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      Arbre
                    </button>
                    <button
                      onClick={() => setVueActive('feuille')}
                      className={`px-4 py-2 rounded font-semibold transition-colors ${
                        vueActive === 'feuille' ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      Feuille de Perso
                    </button>
                  </div>

                  <div className="flex gap-2 flex-wrap">
                    {vueActive === 'arbre' && (
                      <div className="flex items-center gap-2 border-r border-slate-600 pr-4">
                        <span className="text-white text-sm font-semibold">Zoom:</span>
                        <button
                          onClick={() => setZoom(Math.max(0.5, zoom - 0.1))}
                          className="px-3 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded font-bold transition-colors"
                          title="Dézoomer"
                        >
                          −
                        </button>
                        <span className="text-white text-sm font-mono">{Math.round(zoom * 100)}%</span>
                        <button
                          onClick={() => setZoom(Math.min(1.5, zoom + 0.1))}
                          className="px-3 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded font-bold transition-colors"
                          title="Zoomer"
                        >
                          +
                        </button>
                      </div>
                    )}

                    {modeLectureSeule && (
                      <div className="px-4 py-2 bg-slate-600 text-white rounded font-semibold flex items-center gap-2">
                        🔒 Mode Lecture Seule
                      </div>
                    )}

                    {!modeLectureSeule && (
                      <>
                        <button
                          onClick={() => setModeEdition(!modeEdition)}
                          className={`px-4 py-2 rounded font-semibold transition-colors flex items-center gap-2 ${
                            modeEdition ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'
                          } text-white`}
                        >
                          <Edit /> {modeEdition ? 'Quitter Édition' : 'Mode Édition'}
                        </button>

                        {modeEdition && (
                          <button
                            onClick={ajouterTalent}
                            className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded font-semibold transition-colors"
                          >
                            + Nouveau Talent
                          </button>
                        )}
                      </>
                    )}

                    {!modeLectureSeule && (
                      <button
                        onClick={genererLienPartage}
                        className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded font-semibold transition-colors flex items-center gap-2"
                      >
                        <Share /> Partager
                      </button>
                    )}

                    <button
                      onClick={vueActive === 'arbre' ? imprimerArbre : imprimerFeuille}
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-semibold transition-colors flex items-center gap-2"
                    >
                      <Printer /> Imprimer
                    </button>
                  </div>
                </div>

                {/* Vue Arbre */}
                {vueActive === 'arbre' && (
                  <>
                    {/* Compteurs de points */}
                    <div className="bg-slate-800 border-x-2 border-amber-500 p-4 flex justify-center gap-6 flex-wrap no-print">
                      {Object.entries(categories).map(([key, cat]) => {
                        const count = Object.keys(talentsActifs).filter(
                          id => talents[id]?.categorie === key
                        ).length;
                        const total = Object.values(talents).filter(
                          t => t.categorie === key
                        ).length;

                        return (
                          <div key={key} className="flex items-center gap-2">
                            <div className={`w-4 h-4 ${cat.couleur} rounded`}></div>
                            <span className="text-white font-semibold">
                              {count} / {total}
                            </span>
                          </div>
                        );
                      })}
                      <div className="flex items-center gap-4 ml-8">
                        <span className="text-amber-400 font-bold text-lg">
                          {modeEdition ? `Points disponibles: ${pointsDisponibles}` : `Points: ${pointsMax - pointsDisponibles} / ${pointsMax}`}
                        </span>
                        {modeEdition && (
                          <div className="flex items-center gap-2 no-print">
                            <label className="text-white text-sm font-semibold">Points max:</label>
                            <input
                              type="number"
                              min="1"
                              max="100"
                              value={pointsMax}
                              onChange={(e) => {
                                const newMax = parseInt(e.target.value) || 10;
                                setPointsMax(newMax);
                                setPointsDisponibles(newMax);
                              }}
                              className="w-16 px-2 py-1 bg-slate-700 text-white rounded border border-slate-600 text-sm"
                            />
                          </div>
                        )}
                        <button
                          onClick={resetTalents}
                          className="px-4 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-semibold transition-colors no-print"
                        >
                          Réinitialiser
                        </button>
                      </div>
                    </div>

                    {/* Arbre de talents */}
                    <div className="bg-slate-700 rounded-b-lg shadow-2xl overflow-auto">
                      <div className="flex justify-center w-full">
                        <div
                          className="p-8 relative print-talent-tree origin-top-left"
                          style={{
                            minHeight: `${getRequiredHeight()}px`,
                            width: `${getRequiredWidth()}px`,
                            transform: `scale(${zoom})`,
                            transformOrigin: 'top left'
                          }}
                          onDragOver={handleDragOver}
                          onDrop={handleDrop}
                        >
                        <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 1 }}>
                        {/* Points d'ancrage visibles pendant le drag */}
                        {modeEdition && draggingTalent && (
                          <g className="no-print">
                            {/* Points de placement aux intersections de la grille */}
                            {gridRows.map((row, rowIndex) =>
                              gridColumns.map((col, colIndex) => {
                                // Ce point est-il le point cible ?
                                const isTarget = targetGridPoint &&
                                  targetGridPoint.x === col &&
                                  targetGridPoint.y === row;

                                return (
                                  <circle
                                    key={`grid-${rowIndex}-${colIndex}`}
                                    cx={col + 32}
                                    cy={row + 32}
                                    r={isTarget ? "8" : "4"}
                                    fill={isTarget ? "#22c55e" : "#fbbf24"}
                                    opacity={isTarget ? "1" : "0.5"}
                                  />
                                );
                              })
                            )}
                          </g>
                        )}

                        {/* Lignes de connexion */}
                        {Object.values(talents).map(talent =>
                          talent.prerequis.map(prereqId => {
                            const prereq = talents[prereqId];
                            if (!prereq) return null;
                            const isActive = talentsActifs[prereqId] && talentsActifs[talent.id];
                            const isHighlighted = hoveredTalent === talent.id || hoveredTalent === prereqId;

                            // Calculer les centres des talents selon leurs dimensions réelles
                            const prereqDim = getDimensionsTalent(prereq);
                            const talentDim = getDimensionsTalent(talent);

                            // Centres des talents (ajout de 32px pour le padding du container p-8)
                            // Le centre dépend maintenant de la taille du talent
                            const x1 = prereq.position.x + (prereqDim.width / 2) + 32;
                            const y1 = prereq.position.y + (prereqDim.height / 2) + 32;
                            const x2 = talent.position.x + (talentDim.width / 2) + 32;
                            const y2 = talent.position.y + (talentDim.height / 2) + 32;

                            const strokeColor = isActive ? '#fbbf24' : isHighlighted ? '#94a3b8' : '#475569';
                            const strokeW = isActive ? 3 : isHighlighted ? 2 : 2;
                            const dashArray = isActive ? '0' : '5,5';

                            return (
                              <g key={`${prereqId}-${talent.id}`}>
                                {/* Ligne droite entre les centres */}
                                <line
                                  x1={x1}
                                  y1={y1}
                                  x2={x2}
                                  y2={y2}
                                  stroke={strokeColor}
                                  strokeWidth={strokeW}
                                  strokeDasharray={dashArray}
                                  className="transition-all duration-300"
                                />
                              </g>
                            );
                          })
                        )}
                      </svg>

                      {/* Talents */}
                      <div className="relative" style={{ zIndex: 2 }}>
                        {Object.values(talents).map(talent => {
                          const isActive = talentsActifs[talent.id];
                          const isAvailable = peutEtreActive(talent.id);
                          const isHovered = hoveredTalent === talent.id;
                          const categorie = categories[talent.categorie];
                          const isEditing = editingTalent === talent.id;
                          const dimensions = getDimensionsTalent(talent);

                          // Point d'ancrage en haut à gauche (pas de centrage)
                          const offsetX = 0;
                          const offsetY = 0;

                          return (
                            <div
                              key={talent.id}
                              className={`absolute group ${draggingTalent === talent.id ? 'dragging' : ''}`}
                              style={{
                                left: `${talent.position.x}px`,
                                top: `${talent.position.y}px`,
                                width: `${dimensions.width}px`,
                                height: `${dimensions.height}px`,
                                maxHeight: `${dimensions.height}px`,
                                minHeight: `${dimensions.height}px`,
                                overflow: 'visible'
                              }}
                              draggable={modeEdition}
                              onDragStart={(e) => handleDragStart(e, talent.id)}
                              onDragEnd={handleDragEnd}
                              onMouseEnter={() => !modeEdition && setHoveredTalent(talent.id)}
                              onMouseLeave={() => setHoveredTalent(null)}
                            >
                              {isEditing ? (
                                // Formulaire d'édition - Box fixe déportée
                                <div
                                  key={talent.id}
                                  className="absolute bg-slate-800 border-2 border-amber-500 rounded-lg p-3 shadow-xl overflow-y-auto no-print"
                                  style={{
                                    width: '320px',
                                    height: '480px',
                                    top: '0',
                                    left: '0',
                                    zIndex: 1000
                                  }}
                                >
                                  <input
                                    type="text"
                                    defaultValue={talent.nom}
                                    placeholder="Nom"
                                    className="w-full mb-2 p-1 text-sm bg-slate-700 text-white rounded"
                                    id={`nom-${talent.id}`}
                                  />
                                  <textarea
                                    defaultValue={talent.description}
                                    placeholder="Description"
                                    className="w-full mb-2 p-1 text-xs bg-slate-700 text-white rounded"
                                    rows="6"
                                    id={`desc-${talent.id}`}
                                  />
                                  <input
                                    type="number"
                                    defaultValue={talent.cout}
                                    placeholder="Coût"
                                    className="w-full mb-2 p-1 text-sm bg-slate-700 text-white rounded"
                                    id={`cout-${talent.id}`}
                                  />
                                  <select
                                    defaultValue={talent.typeTalent || 'grand_carre'}
                                    className="w-full mb-2 p-1 text-sm bg-slate-700 text-white rounded"
                                    id={`type-${talent.id}`}
                                  >
                                    {['grand_carre', 'rectangle', 'petit_carre'].map(type => (
                                      <option key={type} value={type}>
                                        {typesTalent[type].nom} ({typesTalent[type].width}x{typesTalent[type].height})
                                      </option>
                                    ))}
                                  </select>
                                  <select
                                    defaultValue={talent.couleurTalent || 'action'}
                                    className="w-full mb-2 p-1 text-sm bg-slate-700 text-white rounded"
                                    id={`couleur-${talent.id}`}
                                  >
                                    {Object.entries(couleursTalent)
                                      .sort((a, b) => a[1].nom.localeCompare(b[1].nom))
                                      .map(([key, value]) => (
                                        <option key={key} value={key}>
                                          {value.nom}
                                        </option>
                                      ))}
                                  </select>

                                  {/* Sélecteur de prérequis */}
                                  <div className="mb-2 p-2 bg-slate-700 rounded">
                                    <div className="text-xs text-white mb-1 font-semibold">Prérequis:</div>
                                    <div className="max-h-24 overflow-y-auto text-xs">
                                      {Object.values(talents)
                                        .filter(t => t.id !== talent.id)
                                        .sort((a, b) => a.nom.localeCompare(b.nom))
                                        .map(t => (
                                          <label key={t.id} className="flex items-center gap-1 text-white cursor-pointer hover:bg-slate-600 px-1 rounded">
                                            <input
                                              type="checkbox"
                                              defaultChecked={talent.prerequis.includes(t.id)}
                                              className="prereq-check"
                                              data-talent-id={talent.id}
                                              data-prereq-id={t.id}
                                            />
                                            <span>{t.nom}</span>
                                          </label>
                                        ))
                                      }
                                    </div>
                                  </div>

                                  <div className="flex flex-col gap-2">
                                    <div className="flex gap-2">
                                      <button
                                        onClick={() => {
                                          // Récupérer les prérequis cochés
                                          const prerequis = Array.from(document.querySelectorAll(`.prereq-check[data-talent-id="${talent.id}"]:checked`))
                                            .map(checkbox => checkbox.getAttribute('data-prereq-id'));

                                          sauvegarderTalent(talent.id, {
                                            nom: document.getElementById(`nom-${talent.id}`).value,
                                            description: document.getElementById(`desc-${talent.id}`).value,
                                            cout: parseInt(document.getElementById(`cout-${talent.id}`).value),
                                            typeTalent: document.getElementById(`type-${talent.id}`).value,
                                            couleurTalent: document.getElementById(`couleur-${talent.id}`).value,
                                            prerequis: prerequis
                                          });
                                        }}
                                        className="flex-1 px-2 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-xs"
                                      >
                                        Sauvegarder
                                      </button>
                                      <button
                                        onClick={() => {
                                          // Désactiver tous les prérequis
                                          const checkboxes = document.querySelectorAll(`.prereq-check[data-talent-id="${talent.id}"]`);
                                          checkboxes.forEach(cb => cb.checked = false);
                                        }}
                                        className="flex-1 px-2 py-1 bg-orange-600 hover:bg-orange-700 text-white rounded text-xs"
                                      >
                                        Briser les Liens
                                      </button>
                                    </div>
                                    <div className="flex gap-2">
                                      <button
                                        onClick={() => dupliquerTalent(talent.id)}
                                        className="flex-1 px-2 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs"
                                      >
                                        Dupliquer
                                      </button>
                                      <button
                                        onClick={() => supprimerTalent(talent.id)}
                                        className="flex-1 px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs"
                                      >
                                        Supprimer
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              ) : (
                                // Affichage normal
                                <div className="relative">
                                  <button
                                    onClick={() => modeEdition ? setEditingTalent(talent.id) : toggleTalent(talent.id)}
                                    disabled={!modeEdition && !isAvailable && !isActive}
                                    style={{
                                      backgroundColor: isActive ? getCouleurTalent(talent) : undefined,
                                      boxSizing: 'border-box',
                                      height: `${dimensions.height}px`,
                                      maxHeight: `${dimensions.height}px`,
                                      minHeight: `${dimensions.height}px`,
                                      width: `${dimensions.width}px`,
                                      maxWidth: `${dimensions.width}px`,
                                      minWidth: `${dimensions.width}px`
                                    }}
                                    className={`
                                      rounded-lg border-2 transition-all duration-300 relative print-talent p-1
                                      ${isActive
                                        ? 'border-amber-400 shadow-lg shadow-amber-500/50 active'
                                        : isAvailable
                                        ? 'bg-slate-600 border-slate-400 hover:border-amber-400 hover:shadow-lg'
                                        : 'bg-slate-800 border-slate-700 cursor-not-allowed'
                                      }
                                      ${isHovered ? 'ring-2 ring-amber-400' : ''}
                                      ${modeEdition ? 'cursor-move' : ''}
                                    `}
                                  >
                                    {/* Coût */}
                                    <div className={`
                                      absolute -top-4 -right-4 w-8 h-8 rounded-full
                                      flex items-center justify-center font-bold text-sm
                                      ${isActive ? 'bg-amber-500 text-white' : 'bg-slate-500 text-white'}
                                      border-2 ${isActive ? 'border-amber-300' : 'border-slate-400'}
                                    `}>
                                      {talent.cout}
                                    </div>

                                    {/* Bonus */}
                                    {talent.bonus && (
                                      <div className={`
                                        absolute -top-4 -left-4 px-2 py-1 rounded text-xs font-bold
                                        ${isActive ? 'bg-green-500 text-white' : 'bg-slate-500 text-white'}
                                        border ${isActive ? 'border-green-400' : 'border-slate-400'}
                                      `}>
                                        {talent.bonus}
                                      </div>
                                    )}

                                    {/* Contenu texte avec overflow contrôlé */}
                                    <div className="w-full h-full flex flex-col items-center justify-center overflow-hidden">
                                      {(talent.typeTalent === 'grand_carre' || talent.typeTalent === 'action') && (
                                        <>
                                          <div className="text-white font-bold text-sm mb-2 text-center line-clamp-2">
                                            {talent.nom}
                                          </div>
                                          <div className="text-xs text-slate-200 text-center leading-relaxed line-clamp-5" style={{ whiteSpace: 'pre-line' }}>
                                            {talent.description}
                                          </div>
                                        </>
                                      )}

                                      {(talent.typeTalent === 'rectangle' || talent.typeTalent === 'passif') && (
                                        <>
                                          <div className="text-xs text-slate-200 text-center leading-tight line-clamp-3" style={{ whiteSpace: 'pre-line' }}>
                                            {talent.description}
                                          </div>
                                        </>
                                      )}

                                      {(talent.typeTalent === 'petit_carre' || talent.typeTalent === 'bonus') && (
                                        <>
                                          <div className="text-white font-bold text-xs text-center line-clamp-1 leading-tight mb-2">
                                            {talent.nom}
                                          </div>
                                          <div className="text-xs text-slate-200 text-center leading-tight line-clamp-2" style={{ whiteSpace: 'pre-line' }}>
                                            {talent.description}
                                          </div>
                                        </>
                                      )}
                                    </div>

                                    {/* Checkbox indicator */}
                                    <div className={`
                                      absolute top-2 left-2 w-4 h-4 border-2 rounded
                                      ${isActive ? 'bg-amber-400 border-amber-500' : 'border-slate-400'}
                                    `}>
                                      {isActive && (
                                        <svg className="w-full h-full text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                                        </svg>
                                      )}
                                    </div>
                                  </button>

                                  {/* Boutons d'édition */}
                                  {modeEdition && (
                                    <div className="absolute -bottom-8 left-0 right-0 flex gap-1 justify-center no-print">
                                      <button
                                        onClick={() => setEditingTalent(talent.id)}
                                        className="px-2 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs"
                                      >
                                        ✏️
                                      </button>
                                      <button
                                        onClick={() => dupliquerTalent(talent.id)}
                                        className="px-2 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-xs"
                                      >
                                        📋
                                      </button>
                                      <button
                                        onClick={() => supprimerTalent(talent.id)}
                                        className="px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs"
                                      >
                                        🗑️
                                      </button>
                                    </div>
                                  )}

                                  {/* Infobulle détaillée au survol */}
                                  {isHovered && !modeEdition && (
                                    talent.position.y === 0 ? (
                                      // Infobulle vers le bas pour la première ligne
                                      <div className="absolute left-1/2 -translate-x-1/2 -bottom-2 translate-y-full w-64 bg-slate-900 border-2 border-amber-400 rounded-lg p-3 shadow-2xl no-print" style={{ zIndex: 9999 }}>
                                        <div className="absolute left-1/2 -translate-x-1/2 -top-2 w-0 h-0 border-l-8 border-r-8 border-b-8 border-transparent border-b-amber-400"></div>
                                        <div className="text-amber-400 font-bold text-sm mb-1">{talent.nom}</div>
                                        <div className="text-white text-xs mb-2" style={{ whiteSpace: 'pre-line' }}>{talent.description}</div>
                                        <div className="flex justify-between items-center text-xs">
                                          <span className="text-slate-300">Coût: <span className="text-amber-400 font-bold">{talent.cout} points</span></span>
                                          {talent.bonus && (
                                            <span className="text-green-400 font-bold">{talent.bonus}</span>
                                          )}
                                        </div>
                                        {talent.prerequis.length > 0 && (
                                          <div className="mt-2 pt-2 border-t border-slate-700">
                                            <div className="text-slate-400 text-xs">
                                              Prérequis: {talent.prerequis.map(p => talents[p]?.nom || p).join(', ')}
                                            </div>
                                          </div>
                                        )}
                                      </div>
                                    ) : (
                                      // Infobulle vers le haut pour les autres lignes
                                      <div className="absolute left-1/2 -translate-x-1/2 -top-2 -translate-y-full w-64 bg-slate-900 border-2 border-amber-400 rounded-lg p-3 shadow-2xl no-print" style={{ zIndex: 9999 }}>
                                        <div className="text-amber-400 font-bold text-sm mb-1">{talent.nom}</div>
                                        <div className="text-white text-xs mb-2" style={{ whiteSpace: 'pre-line' }}>{talent.description}</div>
                                        <div className="flex justify-between items-center text-xs">
                                          <span className="text-slate-300">Coût: <span className="text-amber-400 font-bold">{talent.cout} points</span></span>
                                          {talent.bonus && (
                                            <span className="text-green-400 font-bold">{talent.bonus}</span>
                                          )}
                                        </div>
                                        {talent.prerequis.length > 0 && (
                                          <div className="mt-2 pt-2 border-t border-slate-700">
                                            <div className="text-slate-400 text-xs">
                                              Prérequis: {talent.prerequis.map(p => talents[p]?.nom || p).join(', ')}
                                            </div>
                                          </div>
                                        )}
                                        <div className="absolute left-1/2 -translate-x-1/2 -bottom-2 w-0 h-0 border-l-8 border-r-8 border-t-8 border-transparent border-t-amber-400"></div>
                                      </div>
                                    )
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                      </div>
                  </div>

                    {/* Légende */}
                    <div className="mt-6 bg-slate-800 rounded-lg p-4 border border-slate-600 no-print">
                      <div className="flex items-center gap-2 text-slate-300 text-sm mb-2">
                        <Info />
                        <span className="font-semibold">Instructions:</span>
                      </div>
                      <ul className="text-slate-400 text-xs space-y-1 ml-6">
                        <li>• Survolez un talent pour voir ses détails complets</li>
                        <li>• Cliquez pour activer/désactiver un talent</li>
                        <li>• Les talents grisés nécessitent des prérequis</li>
                        <li>• Les lignes en pointillés montrent les connexions inactives</li>
                        {modeEdition && (
                          <>
                            <li className="text-green-400">• MODE ÉDITION: Glissez-déposez pour déplacer les talents</li>
                            <li className="text-green-400">• Cliquez sur ✏️ pour modifier, 🗑️ pour supprimer</li>
                          </>
                        )}
                      </ul>
                    </div>
                  </>
                )}

                {/* Vue Feuille de personnage */}
                {vueActive === 'feuille' && (
                  <div className="bg-white rounded-b-lg p-4 shadow-2xl text-black print-feuille">
                    <h2 className="text-2xl font-bold mb-3 text-center border-b-2 border-amber-500 pb-2">
                      Feuille de Personnage
                    </h2>

                    {/* Récapitulatif compact */}
                    <div className="mb-3 p-2 bg-amber-50 border border-amber-500 rounded flex justify-between text-sm">
                      <span><strong>Points:</strong> {pointsMax - pointsDisponibles}/{pointsMax}</span>
                      <span><strong>Talents:</strong> {Object.keys(talentsActifs).length}</span>
                      <span><strong>Bonus:</strong> {Object.entries(talentsActifs).filter(([id]) => talents[id]?.bonus).length}</span>
                    </div>

                    {/* Talents actifs groupés par type */}
                    {Object.keys(talentsActifs).length === 0 ? (
                      <div className="text-center text-gray-500 py-12">
                        Aucun talent sélectionné. Retournez à l'arbre pour choisir vos talents.
                      </div>
                    ) : (
                      <div className="space-y-6">
                        {/* Itérer sur tous les types de talents (triés alphabétiquement) */}
                        {Object.entries(couleursTalent)
                          .sort((a, b) => a[1].nom.localeCompare(b[1].nom))
                          .map(([typeKey, typeInfo]) => {
                            const talentsDeCeType = Object.entries(talentsActifs).filter(([id]) => talents[id]?.couleurTalent === typeKey);

                            if (talentsDeCeType.length === 0) return null;

                            return (
                              <div key={typeKey}>
                                <h3 className="text-lg font-bold mb-3 pb-1 border-b border-slate-300" style={{ color: typeInfo.code }}>
                                  {typeInfo.nom}
                                </h3>
                                <div className="flex flex-wrap gap-4">
                                  {talentsDeCeType.map(([id]) => {
                                    const talent = talents[id];
                                    const dimensions = getDimensionsTalent(talent);
                                    const couleur = getCouleurTalent(talent);

                                    return (
                                      <div
                                        key={id}
                                        className="relative rounded-lg border-2 border-slate-800 p-1 shadow-lg"
                                        style={{
                                          backgroundColor: couleur,
                                          width: `${dimensions.width}px`,
                                          minHeight: `${dimensions.height}px`,
                                          maxHeight: `${dimensions.height}px`,
                                          boxSizing: 'border-box'
                                        }}
                                      >
                                        <div className="absolute -top-4 -right-4 w-8 h-8 rounded-full bg-amber-500 text-white border-2 border-amber-300 flex items-center justify-center font-bold text-sm">
                                          {talent.cout}
                                        </div>
                                        {talent.bonus && (
                                          <div className="absolute -top-4 -left-4 px-2 py-1 rounded text-xs font-bold bg-green-500 text-white border border-green-400">
                                            {talent.bonus}
                                          </div>
                                        )}
                                        <div className="w-full h-full flex flex-col items-center justify-center overflow-hidden text-white">
                                          {(talent.typeTalent === 'grand_carre' || talent.typeTalent === 'action') && (
                                            <>
                                              <div className="font-bold text-sm mb-2 text-center line-clamp-2">{talent.nom}</div>
                                              <div className="text-xs text-center leading-relaxed line-clamp-5" style={{ whiteSpace: 'pre-line' }}>{talent.description}</div>
                                            </>
                                          )}
                                          {(talent.typeTalent === 'rectangle' || talent.typeTalent === 'passif') && (
                                            <>
                                              <div className="text-xs text-center leading-tight line-clamp-3" style={{ whiteSpace: 'pre-line' }}>{talent.description}</div>
                                            </>
                                          )}
                                          {(talent.typeTalent === 'petit_carre' || talent.typeTalent === 'bonus') && (
                                            <>
                                              <div className="font-bold text-xs text-center line-clamp-1 leading-tight mb-2">{talent.nom}</div>
                                              <div className="text-xs text-center leading-tight line-clamp-2" style={{ whiteSpace: 'pre-line' }}>{talent.description}</div>
                                            </>
                                          )}
                                        </div>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArbreTalents />);
    </script>
</body>
</html>
