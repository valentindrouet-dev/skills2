    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }

        /* Styles pour l'impression */
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
            }

            /* A4 portrait pour l'arbre */
            @page arbre {
                size: A4 portrait;
                margin: 0.5cm;
            }

            /* A4 portrait pour la feuille */
            @page feuille {
                size: A4 portrait;
                margin: 0.5cm;
            }

            .print-page-break {
                page-break-after: always;
            }

            .print-talent-tree {
                background: white !important;
                padding: 10px;
                max-width: 100%;
                overflow: visible !important;
                page: arbre;
                transform: scale(0.7) !important;
                transform-origin: top left !important;
            }

            .print-talent {
                border: 2px solid #333 !important;
                box-shadow: none !important;
                transform: none !important;
                opacity: 1 !important;
            }

            /* Talents NON-ACTIFS : fond blanc, texte noir */
            .print-talent:not(.active) {
                background-color: white !important;
                color: black !important;
            }

            .print-talent:not(.active) * {
                color: black !important;
            }

            /* Talents ACTIFS : garder les couleurs */
            .print-talent.active {
                border-width: 3px !important;
                border-color: #000 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: inherit !important;
            }

            .print-talent.active * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Masquer les badges pour l'impression */
            .print-talent > div:first-child {
                opacity: 0.8;
            }

            /* Styles pour la feuille de perso */
            .print-feuille {
                page: feuille;
                transform: scale(0.85) !important;
                transform-origin: top left !important;
                max-width: 100%;
                overflow: hidden !important;
            }

            .print-feuille * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .bg-white {
                background: white !important;
            }
        }

        .dragging {
            opacity: 0.5;
            cursor: move;
        }
    </style>

        function ArbreTalents() {
          // Grille de placement : points d'ancrage tous les 20px

          const gridColumns = Array.from({ length: 68 }, (_, i) => i * 20); // [0, 20, 40, 60, ..., 1340]

          // Ref pour éviter la sauvegarde automatique pendant le chargement
          const isLoadingFromFirebase = React.useRef(true);
          const isInitialMount = React.useRef(true);
          const isSavingToFirebase = React.useRef(false); // Flag pour éviter les boucles de sync

          // Les 8 classes fixes
          const CLASSES = ['Apothicaire', 'Artificier', 'Chasseur', 'Destructeur', 'Déviant', 'Gardien', 'Lamevent', 'Pyromane'];

          // Bonus de PV par classe (non-éditable)
          const BONUS_PV_PAR_CLASSE = {

          // États pour la gestion des arbres GM
          const [arbreActuel, setArbreActuel] = useState('Gardien');
          const [nomArbrePartage, setNomArbrePartage] = useState(''); // Nom de l'arbre partagé (PJ)

          const [pointsDisponibles, setPointsDisponibles] = useState(5);
          const [pointsMax, setPointsMax] = useState(5);
          const [talentsActifs, setTalentsActifs] = useState({});
          const [hoveredTalent, setHoveredTalent] = useState(null);
          const [modeEdition, setModeEdition] = useState(false);
          const [vueActive, setVueActive] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.get('view') || 'arbre'; // 'arbre' ou 'feuille'
          });
          const [zoom, setZoom] = useState(() => {

          const [notification, setNotification] = useState(null); // Pour les messages temporaires

          // États pour les caractéristiques du personnage

            // Recalculer les points disponibles en fonction des talents actifs
            const pointsDepenses = Object.keys(talentsActifs).reduce((total, id) => {
              return total + (talents[id]?.cout || 0);
            }, 0);
            setPointsDisponibles(nouveauxPointsMax - pointsDepenses);
          }, [niveau, talentsActifs, talents]);

          const talentsParDefaut = {
            vie1: {

              description: 'Augmente vos points de vie de 1',

              couleurTalent: 'action' // action, amelioration, passif
            },
            alchimiste1: {
              id: 'alchimiste1',
              nom: 'Alchimiste : Artificier',
              cout: 2,
              bonus: 'Endu +2',
              description: 'Vous débutez chaque combat avec 1 grenade qui inflige des dégâts à tous les combattants en petit rayon',

            },
            analyse: {
              id: 'analyse',

              prerequis: ['analyse'],
              categorie: 'soin',
              typeTalent: 'grand_carre',
              couleurTalent: 'action'
            },
            vie2: {
              id: 'vie2',
              nom: 'Vitalité II',
              cout: 1,
              bonus: 'Vie +1',
              description: 'Augmente vos points de vie de 1 supplémentaire',
              position: { x: 1000, y: 0 },
              prerequis: ['alchimiste2'],
              categorie: 'vie',
              typeTalent: 'grand_carre',
              couleurTalent: 'action'
            }
          };

          const [talents, setTalents] = useState(talentsParDefaut);
          const [editingTalent, setEditingTalent] = useState(null);
          const [draggingTalent, setDraggingTalent] = useState(null);
          const [dragOffset, setDragOffset] = useState(null); // Offset entre la souris et le coin sup gauche du talent
          const [targetGridPoint, setTargetGridPoint] = useState(null); // Point d'ancrage cible pendant le drag
          // Détecter le mode lecture seule dès l'initialisation
          const [modeLectureSeule, setModeLectureSeule] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.has('data'); // Mode lecture seule si paramètre 'data' présent
          });

          // Détecter le mode player (partage pour les joueurs)
          const [modePlayer, setModePlayer] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.get('player') === 'true';
          });

          // Détecter le mode print (impression avec fond blanc)
          const [modePrint, setModePrint] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.get('print') === 'true';
          });

          const categories = {
            vie: { couleur: 'bg-orange-600', nom: 'Vie' },
            combat: { couleur: 'bg-blue-600', nom: 'Combat' },
            analyse: { couleur: 'bg-purple-600', nom: 'Analyse' },
            soin: { couleur: 'bg-green-600', nom: 'Soin' }
          };

          // Types de talents et leurs dimensions
          const typesTalent = {
            grand_carre: { width: 200, height: 200, nom: 'Grand Carré' },
            rectangle: { width: 200, height: 80, nom: 'Rectangle' },
            petit_carre: { width: 80, height: 80, nom: 'Petit Carré' },
            // Compatibilité anciens noms
            action: { width: 200, height: 200, nom: 'Grand Carré' },
            passif: { width: 200, height: 80, nom: 'Rectangle' },
            bonus: { width: 80, height: 80, nom: 'Petit Carré' },
            competence: { width: 80, height: 80, nom: 'Petit Carré (legacy)' }  // Rétrocompatibilité
          };

          // Couleurs de talents
          const couleursTalent = {
            action: { code: '#4278ac', nom: 'Actions' },           // Blue
            amelioration: { code: '#4e8b51', nom: 'Améliorations' },     // Green
            aventure: { code: '#8B6F47', nom: 'Aventure' },        // Brown
            competence: { code: '#E57036', nom: 'Comp (legacy)' },  // Orange - Rétrocompatibilité
            degats: { code: '#d56161', nom: 'Dégâts' },
            endu: { code: '#6fbdb5', nom: 'Endu' },
            maitrise: { code: '#ca8a04', nom: 'Maîtrises' },        // Yellow
            passif: { code: '#999999', nom: 'Passifs' },
            reaction: { code: '#7d5f92', nom: 'Réactions' },           // Purple
            vie: { code: '#e281d1', nom: 'Vie' }                   // Rose
          };

          // Helper pour obtenir les dimensions d'un talent
          const getDimensionsTalent = (talent) => {
            const type = talent?.typeTalent || 'grand_carre'; // Par défaut: Grand Carré
            return typesTalent[type] || typesTalent.grand_carre;
          };

          // Helper pour obtenir la couleur d'un talent
          const getCouleurTalent = (talent) => {
            const couleur = talent?.couleurTalent || 'action'; // Par défaut: action
            return couleursTalent[couleur]?.code || couleursTalent.action.code;
          };

          // Helpers pour vérifier les types de talents
          const isGrandCarre = (talent) => talent.typeTalent === 'grand_carre' || talent.typeTalent === 'action';
          const isRectangle = (talent) => talent.typeTalent === 'rectangle' || talent.typeTalent === 'passif';
          const isPetitCarre = (talent) => talent.typeTalent === 'petit_carre' || talent.typeTalent === 'bonus';

          // Couleurs de bandeau par classe
          const getCouleurClasse = (classe) => {
            const couleurs = {
              'Apothicaire': 'from-green-600 to-green-500',
              'Artificier': 'from-cyan-600 to-cyan-500',
              'Chasseur': 'from-amber-700 to-amber-600',
              'Destructeur': 'from-red-600 to-red-500',
              'Déviant': 'from-purple-600 to-purple-500',
              'Gardien': 'from-blue-600 to-blue-500',
              'Lamevent': 'from-slate-600 to-slate-500',
              'Pyromane': 'from-orange-600 to-orange-500'
            };
            return couleurs[classe] || 'from-amber-600 to-amber-500';
          };

          const getCouleurClasseHex = (classe) => {
            const couleurs = {
              'Apothicaire': '#16a34a',
              'Artificier': '#0891b2',
              'Chasseur': '#b45309',
              'Destructeur': '#dc2626',
              'Déviant': '#9333ea',
              'Gardien': '#2563eb',
              'Lamevent': '#475569',
              'Pyromane': '#ea580c'
            };
            return couleurs[classe] || '#d97706';
          };

          // Remplacer les marqueurs dynamiques dans les descriptions
          const replaceMarkers = (description) => {
            if (!description) return description;

            let result = description;

            // Remplacer les marqueurs simples et avec formules
            result = result.replace(/\{([^}]+)\}/g, (match, formula) => {
              try {
                // Remplacer les variables par leurs valeurs
                let expr = formula
                  .replace(/ENDU/g, getTotalEndu())
                  .replace(/VIE/g, getTotalVie())
                  .replace(/DEGATS/g, getTotalDegats())
                  .replace(/NIVEAU/g, niveau)
                  .replace(/PV/g, getPointsDeVie());

                // Évaluer la formule de manière sûre (seulement +, -, *, /)
                if (/^[\d\s+\-*/.()]+$/.test(expr)) {
                  const value = eval(expr);
                  return Math.floor(value);
                }

                return match; // Si la formule est invalide, laisser tel quel
              } catch (e) {
                return match; // En cas d'erreur, laisser tel quel
              }
            });

            return result;
          };

          // Obtenir les classes de couleur selon le coût du talent
          const getCoutColorClasses = (cout, isActive) => {
            if (!isActive) return 'bg-slate-500 border-slate-400';

            if (cout === 1) return 'bg-green-500 border-green-300';
            if (cout === 2) return 'bg-amber-500 border-amber-300';
            if (cout >= 3) return 'bg-orange-500 border-orange-300';

            return 'bg-amber-500 border-amber-300'; // Par défaut
          };

          // Calculer la taille de police dynamique selon la longueur du texte et largeur du talent
          const getDynamicFontSize = (text, baseSize, talentWidth) => {
            if (!text) return baseSize;

            // Estimation : ~7 pixels par caractère en moyenne pour la police de base
            const charWidthEstimate = baseSize * 0.5;
            const maxCharsPerLine = Math.floor(talentWidth / charWidthEstimate);
            const lines = text.split('\n');

            // Vérifier si une ligne dépasse la largeur
            const hasOverflow = lines.some(line => line.length > maxCharsPerLine);

            if (hasOverflow) {
              // Réduire proportionnellement
              const maxLineLength = Math.max(...lines.map(l => l.length));
              const ratio = maxCharsPerLine / maxLineLength;
              return Math.max(baseSize * ratio * 0.9, baseSize * 0.6); // Min 60% de la taille de base
            }

            return baseSize;
          };

          // Calculer le total d'ENDU (via effets spéciaux uniquement)
          const getTotalEndu = () => {
            let total = 0;

            // Effets spéciaux: bonus d'ENDU depuis les talents
            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent?.effetSpecial?.type === 'bonus_endu') {
                const source = talent.effetSpecial.source;
                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                if (source === 'fixe') {
                  total += Math.floor(talent.effetSpecial.valeur || multiplicateur);
                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                }
              }
            });

            return total;
          };

          // Calculer le total de DEGATS (via effets spéciaux uniquement)
          const getTotalDegats = () => {
            let total = 0;

            // Effets spéciaux: bonus de dégâts depuis les talents
            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent?.effetSpecial?.type === 'bonus_degats') {
                const source = talent.effetSpecial.source;
                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                if (source === 'endu') {
                  total += Math.floor(getTotalEndu() * multiplicateur);
                } else if (source === 'vie') {
                  total += Math.floor(getTotalVie() * multiplicateur);
                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                } else if (source === 'fixe') {
                  total += Math.floor(talent.effetSpecial.valeur || multiplicateur);
                }
              }
            });

            return total;
          };

          // Calculer le total de VIE (via effets spéciaux uniquement)
          const getTotalVie = () => {
            let total = 3; // VIE de base = 3 pour toutes les classes

            // Effets spéciaux: bonus de VIE depuis les talents
            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent?.effetSpecial?.type === 'bonus_vie') {
                const source = talent.effetSpecial.source;
                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                if (source === 'fixe') {
                  total += Math.floor(talent.effetSpecial.valeur || multiplicateur);
                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                }
              }
            });

            return total;
          };

          // Calculer les Points de Vie (VIE x ENDU + Bonus)
          const getPointsDeVie = () => {
            let total = getTotalVie() * getTotalEndu() + getBonusPV();

            // Effets spéciaux: bonus de PV depuis d'autres talents
            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent?.effetSpecial?.type === 'bonus_pv') {
                const source = talent.effetSpecial.source; // 'endu', 'vie', 'degats', 'niveau', etc.
                const multiplicateur = talent.effetSpecial.multiplicateur || 1;

                if (source === 'endu') {
                  total += Math.floor(getTotalEndu() * multiplicateur);
                } else if (source === 'vie') {
                  total += Math.floor(getTotalVie() * multiplicateur);
                } else if (source === 'degats') {
                  total += Math.floor(getTotalDegats() * multiplicateur);
                } else if (source === 'niveau') {
                  total += Math.floor(niveau * multiplicateur);
                } else if (source === 'fixe') {
                  total += Math.floor(talent.effetSpecial.valeur || 0);
                }
              }
            });

            return total;
          };

          // Les 8 compétences (ordre alphabétique)
          const COMPETENCES = ['AGILITE', 'FORCE', 'MYSTICISME', 'PERCEPTION', 'ROBUSTESSE', 'RUSE', 'SAVOIR', 'TECHNIQUE'];

          // Calculer le total d'une compétence spécifique
          const getTotalCompetence = (competence) => {
            return Object.keys(talentsActifs).filter(id => {
              const talent = talents[id];
              return talent && talent.competence === competence;
            }).length;
          };

          // Obtenir toutes les compétences avec au moins 1 point
          const getCompetencesActives = () => {
            return COMPETENCES.filter(comp => getTotalCompetence(comp) > 0);
          };

          // Compter les talents actifs par type de couleur
          const getTalentsParType = () => {
            const compteurs = {};
            Object.keys(talentsActifs).forEach(id => {
              const talent = talents[id];
              if (talent) {
                const type = talent.couleurTalent || 'action';
                compteurs[type] = (compteurs[type] || 0) + 1;
              }
            });
            return compteurs;
          };

          // Helper pour calculer la hauteur nécessaire de l'interface
          const getRequiredHeight = () => {
            if (Object.keys(talents).length === 0) return 2500;

            let maxY = 2500; // Hauteur minimale augmentée pour permettre plus d'espace
            Object.values(talents).forEach(talent => {
              const dim = getDimensionsTalent(talent);
              const talentBottom = talent.position.y + dim.height + 150; // +150 pour marge
              if (talentBottom > maxY) maxY = talentBottom;
            });

            return maxY;
          };

          // Helper pour calculer la largeur nécessaire de l'interface
          const getRequiredWidth = () => {
            if (Object.keys(talents).length === 0) return 1300;

            let maxX = 1000; // Largeur minimale
            Object.values(talents).forEach(talent => {
              const dim = getDimensionsTalent(talent);
              const talentRight = talent.position.x + dim.width + 150; // +150 pour marge
              if (talentRight > maxX) maxX = talentRight;
            });

            return maxX;
          };

          // ========== GESTION DE LA SAUVEGARDE GM ==========

          // Créer le talent de départ pour une classe
          const creerTalentDepart = (classe) => {
            return {
              [`talent_depart_${classe.toLowerCase()}`]: {
                id: `talent_depart_${classe.toLowerCase()}`,
                nom: `${classe} - Début`,
                cout: 0,
                description: 'Point de départ de l\'arbre',
                position: { x: 400, y: 100 },
                prerequis: [],
                typeTalent: 'grand_carre',
                couleurTalent: 'amelioration'
              }
            };
          };

          // Sauvegarder automatiquement dans Firebase
          useEffect(() => {
            // Ne pas sauvegarder pendant le chargement initial depuis Firebase
            if (isLoadingFromFirebase.current) {
              console.log('⏸️ Sauvegarde ignorée (chargement en cours)');
              return;
            }

            // Ne pas sauvegarder si les talents sont vides (protection)
            if (!talents || Object.keys(talents).length === 0) {
              console.log('⏸️ Sauvegarde ignorée (talents vides)');
              return;
            }

            console.log('💾 Sauvegarde vers Firebase...', {
              nbTalents: Object.keys(talents).length,
              nbActifs: Object.keys(talentsActifs).length,
              classe: arbreActuel
            });

            // Sauvegarder dans Firebase (remplace localStorage)
            const arbreData = {
              talents,
              talentsActifs,
              nomPersonnage,
              niveau,
              arbreActuel
            };

            // Update hash before saving to prevent loop
            lastSyncedDataHash = getDataHash(talents, talentsActifs, nomPersonnage, niveau, arbreActuel);

            saveToFirebase(arbreData);
          }, [talents, talentsActifs, nomPersonnage, niveau, arbreActuel]);

          // Note: Ancien système d'initialisation des classes localStorage supprimé
          // Maintenant tout est dans Firebase
          // Note: Une URL = une classe (changement de classe = nouvelle URL)

          // Charger depuis Firebase et écouter les changements en temps réel
          useEffect(() => {
            console.log('🔥 Initialisation du listener Firebase pour ID:', TALENT_TREE_ID);

            // Setup real-time listener with onSnapshot
            const unsubscribe = talentTreeRef.onSnapshot((doc) => {
              if (doc.exists) {
                const data = doc.data();

                // Calculate hash of incoming data
                const incomingHash = getDataHash(
                  data.talents || {},
                  data.talentsActifs || {},
                  data.nomPersonnage || '',
                  data.niveau || 1,
                  data.arbreActuel || 'Gardien'
                );

                // If data hasn't changed, skip update (prevent loops)
                if (!isLoadingFromFirebase.current && lastSyncedDataHash === incomingHash) {
                  console.log('⏭️ Update ignorée (données identiques)');
                  return;
                }

                console.log(isLoadingFromFirebase.current ? '📂 Chargement initial depuis Firebase' : '🔄 Mise à jour en temps réel');

                // Update last synced hash
                lastSyncedDataHash = incomingHash;

                // Update state with Firebase data
                setTalents(data.talents || {});
                setTalentsActifs(data.talentsActifs || {});
                setNomPersonnage(data.nomPersonnage || '');
                setNiveau(data.niveau || 1);
                setArbreActuel(data.arbreActuel || 'Gardien');

                // After first load, enable saving
                if (isLoadingFromFirebase.current) {
                  console.log('✅ Chargement terminé, sauvegarde activée');
                  isLoadingFromFirebase.current = false;
                }
              } else {
                // Document n'existe pas : tenter migration localStorage
                console.log('📦 Tentative de migration depuis localStorage...');

                // Chercher la dernière classe active
                const derniereClasse = localStorage.getItem('derniereClasseActive');
                let migrated = false;

                if (derniereClasse) {
                  const savedData = localStorage.getItem(`classe_${derniereClasse}`);
                  if (savedData) {
                    try {
                      const data = JSON.parse(savedData);
                      console.log(`✅ Migration depuis localStorage: ${derniereClasse}`);
                      setTalents(data.talents || {});
                      setTalentsActifs(data.talentsActifs || {});
                      setNomPersonnage(data.nomPersonnage || '');
                      setNiveau(data.niveau || 1);
                      setArbreActuel(derniereClasse);
                      migrated = true;
                    } catch (e) {
                      console.warn('⚠️ Erreur migration localStorage:', e);
                    }
                  }
                }

                if (!migrated) {
                  // Nouveau arbre : initialiser avec un talent de départ
                  console.log('✨ Nouvel arbre de talents créé');
                  const defaultClasse = 'Gardien';
                  const talentDepart = {
                    [`talent_depart_${defaultClasse.toLowerCase()}`]: {
                      id: `talent_depart_${defaultClasse.toLowerCase()}`,
                      nom: `${defaultClasse} - Début`,
                      cout: 0,
                      description: 'Point de départ de l\'arbre',
                      position: { x: 400, y: 100 },
                      prerequis: [],
                      typeTalent: 'grand_carre',
                      couleurTalent: 'amelioration'
                    }
                  };
                  setTalents(talentDepart);
                  setArbreActuel(defaultClasse);
                }

                // Enable saving for new tree
                console.log('✅ Sauvegarde activée');
                isLoadingFromFirebase.current = false;
              }
            }, (error) => {
              console.error('❌ Erreur de synchronisation Firebase:', error);
              // Enable saving even on error
              isLoadingFromFirebase.current = false;
            });

            // Cleanup listener on unmount
            return () => {
              console.log('🔌 Déconnexion du listener Firebase');
              unsubscribe();
            };
          }, []); // Uniquement au démarrage

          // ========== FIN GESTION SAUVEGARDE ==========

          // Note: Ancien système de partage via ?data= supprimé
          // Maintenant tout passe par Firebase avec ?id=xxx

          // Trouver tous les talents qui dépendent d'un talent donné (récursif)
          const findDependentTalents = (talentId, currentActifs, visited = new Set()) => {
            const dependents = [];

            // Protection contre cycles infinis
            if (visited.has(talentId)) return dependents;
            visited.add(talentId);

            // Trouver les talents qui ont talentId comme prérequis et qui sont actifs
            Object.keys(currentActifs).forEach(id => {
              const talent = talents[id];
              if (talent && talent.prerequis && Array.isArray(talent.prerequis) && talent.prerequis.includes(talentId)) {
                dependents.push(id);
                // Récursion pour trouver les talents qui dépendent de celui-ci
                const subDependents = findDependentTalents(id, currentActifs, visited);
                dependents.push(...subDependents);
              }
            });

            return dependents;
          };

          const toggleTalent = (talentId) => {
            if (modeEdition) return; // Pas d'activation en mode édition

            const talent = talents[talentId];

            if (talentsActifs[talentId]) {
              // Trouver tous les talents qui dépendent de celui-ci
              const dependents = findDependentTalents(talentId, talentsActifs);

              // Calculer le total des points à restituer
              let pointsToRestore = talent.cout;
              dependents.forEach(depId => {
                if (talents[depId]) {
                  pointsToRestore += talents[depId].cout;
                }
              });

              // Calculer les nouveaux points dépensés après décochage
              const pointsDepensesActuels = pointsMax - pointsDisponibles;
              const nouveauxPointsDepenses = pointsDepensesActuels - pointsToRestore;

              // Trouver les talents actifs qui n'auront plus assez de points requis
              const talentsADecocher = [];
              Object.keys(talentsActifs).forEach(id => {
                // Ignorer le talent qu'on décoche et ses dépendants (déjà gérés)
                if (id === talentId || dependents.includes(id)) return;

                const t = talents[id];
                if (t && t.pointsRequis && t.pointsRequis > nouveauxPointsDepenses) {
                  talentsADecocher.push({ id, nom: t.nom, pointsRequis: t.pointsRequis });
                }
              });

              // Si des talents seraient affectés, demander confirmation
              if (talentsADecocher.length > 0) {
                const message = talentsADecocher.length === 1
                  ? `⚠️ ATTENTION ⚠️\n\nEn décochant ce talent, vous n'aurez plus assez de points pour conserver le talent "${talentsADecocher[0].nom}" (${talentsADecocher[0].pointsRequis} points pré-requis).\n\nVoulez-vous continuer ?`
                  : `⚠️ ATTENTION ⚠️\n\nEn décochant ce talent, vous n'aurez plus assez de points pour conserver les talents suivants :\n${talentsADecocher.map(t => `- ${t.nom} (${t.pointsRequis} points pré-requis)`).join('\n')}\n\nVoulez-vous continuer ?`;

                const confirmation = window.confirm(message);
                if (!confirmation) return; // Annuler l'opération
              }

              // Calculer tous les points à restituer (y compris les talents sans assez de points)
              talentsADecocher.forEach(t => {
                if (talents[t.id]) {
                  pointsToRestore += talents[t.id].cout;
                }
                // Ajouter aussi les dépendants de ce talent
                const depsTalent = findDependentTalents(t.id, talentsActifs);
                depsTalent.forEach(depId => {
                  if (talents[depId]) {
                    pointsToRestore += talents[depId].cout;
                  }
                });
              });

              // Décocher le talent, ses dépendants et les talents sans assez de points
              setTalentsActifs(prev => {
                const newState = { ...prev };
                delete newState[talentId];

                // Décocher les dépendants
                dependents.forEach(depId => {
                  delete newState[depId];
                });

                // Décocher les talents qui n'ont plus assez de points requis (et leurs dépendants)
                talentsADecocher.forEach(t => {
                  const depsTalent = findDependentTalents(t.id, newState);
                  delete newState[t.id];
                  depsTalent.forEach(depId => {
                    delete newState[depId];
                  });
                });

                return newState;
              });

              setPointsDisponibles(prev => prev + pointsToRestore);
            } else {
              // Au moins un prérequis doit être rempli (OU logique), ou aucun prérequis
              const prerequisRemplis = talent.prerequis.length === 0 || talent.prerequis.some(prereq => talentsActifs[prereq]);

              if (!prerequisRemplis) {
                showNotification('Vous devez sélectionner les talents prérequis !');
                return;
              }

              // Vérifier les points de talents requis (gate)
              if (talent.pointsRequis && talent.pointsRequis > 0) {
                const pointsDepenses = pointsMax - pointsDisponibles;
                if (pointsDepenses < talent.pointsRequis) {
                  const pointsRestants = talent.pointsRequis - pointsDepenses;
                  showNotification(`Vous devez encore dépenser ${pointsRestants} points de talents avant de débloquer celui-ci !`);
                  return;
                }
              }

              if (pointsDisponibles < talent.cout) {
                showNotification('Vous n\'avez plus assez de point de talents !');
                return;
              }

              setTalentsActifs(prev => ({ ...prev, [talentId]: true }));
              setPointsDisponibles(prev => prev - talent.cout);
            }
          };

          // Vérifier si un talent est bloqué par une exclusion mutuelle
          const estBloqueParExclusion = (talentId) => {
            const talent = talents[talentId];
            if (!talent || talentsActifs[talentId]) return false; // Si déjà actif, pas bloqué

            // Vérifier si ce talent exclut des talents actifs
            if (talent.exclusif && talent.exclusif.length > 0) {
              const bloqueParSesExclusions = talent.exclusif.some(exclusId => talentsActifs[exclusId]);
              if (bloqueParSesExclusions) return true;
            }

            // Vérifier si d'autres talents actifs excluent celui-ci (réciprocité)
            const bloqueParAutreTalent = Object.keys(talentsActifs).some(activeId => {
              const activeTalent = talents[activeId];
              return activeTalent?.exclusif && activeTalent.exclusif.includes(talentId);
            });

            return bloqueParAutreTalent;
          };

          // Vérifier si un talent est remplacé par un autre talent actif
          const estRemplace = (talentId) => {
            // Chercher si un talent actif remplace celui-ci
            return Object.keys(talentsActifs).some(activeId => {
              const activeTalent = talents[activeId];
              return activeTalent?.remplace === talentId;
            });
          };

          // Vérifier si un talent automatique est remplacé
          const estTalentAutoRemplace = (autoId) => {
            return Object.keys(talentsActifs).some(activeId => {
              const activeTalent = talents[activeId];
              return activeTalent?.remplace === autoId;
            });
          };

          // Obtenir le nom du talent qui bloque (pour tooltip)
          const getTalentBloquant = (talentId) => {
            const talent = talents[talentId];

            // Vérifier dans ses propres exclusions
            if (talent?.exclusif && talent.exclusif.length > 0) {
              const bloquantId = talent.exclusif.find(exclusId => talentsActifs[exclusId]);
              if (bloquantId) return talents[bloquantId]?.nom;
            }

            // Vérifier réciprocité
            const bloquantId = Object.keys(talentsActifs).find(activeId => {
              const activeTalent = talents[activeId];
              return activeTalent?.exclusif && activeTalent.exclusif.includes(talentId);
            });

            return bloquantId ? talents[bloquantId]?.nom : null;
          };

          const peutEtreActive = (talentId) => {
            const talent = talents[talentId];

            // Si le talent est déjà actif, il peut toujours être décoché
            if (talentsActifs[talentId]) return true;

            // Bloqué par exclusion mutuelle
            if (estBloqueParExclusion(talentId)) return false;

            // Vérifier les points de talents requis (gate)
            if (talent.pointsRequis && talent.pointsRequis > 0) {
              const pointsDepenses = pointsMax - pointsDisponibles;
              if (pointsDepenses < talent.pointsRequis) return false;
            }

            // Au moins un prérequis doit être rempli (OU logique), ou aucun prérequis
            const prerequisRemplis = talent.prerequis.length === 0 || talent.prerequis.some(prereq => talentsActifs[prereq]);
            return prerequisRemplis && pointsDisponibles >= talent.cout;
          };

          // Afficher une notification temporaire (auto-dismiss après 3s)
          const showNotification = (message) => {
            setNotification(message);
            setTimeout(() => setNotification(null), 3000);
          };

          // Créer un nouvel arbre pour une autre classe
          const creerNouvelleClasse = async () => {
            const classesDisponibles = CLASSES.join(', ');
            const classeChoisie = prompt(
              `Créer un nouvel arbre de talents pour quelle classe ?\n\n` +
              `Classes disponibles : ${classesDisponibles}`,
              ''
            );

            if (!classeChoisie) return; // Annulé

            if (!CLASSES.includes(classeChoisie)) {
              showNotification(`❌ Classe "${classeChoisie}" invalide !`);
              return;
            }

            try {
              // Generate new ID for the new class
              const newId = Math.random().toString(36).substring(2, 15) +
                           Math.random().toString(36).substring(2, 15);

              // Create talent de départ for this class
              const talentDepart = {
                [`talent_depart_${classeChoisie.toLowerCase()}`]: {
                  id: `talent_depart_${classeChoisie.toLowerCase()}`,
                  nom: `${classeChoisie} - Début`,
                  cout: 0,
                  description: 'Point de départ de l\'arbre',
                  position: { x: 400, y: 100 },
                  prerequis: [],
                  typeTalent: 'grand_carre',
                  couleurTalent: 'amelioration'
                }
              };

              // Create new tree in Firebase
              const newTreeRef = db.collection('talent-trees').doc(newId);
              await newTreeRef.set({
                talents: talentDepart,
                talentsActifs: {},
                nomPersonnage: '',
                niveau: 1,
                arbreActuel: classeChoisie,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });

              // Open new URL in new tab
              const newUrl = `${window.location.pathname}?id=${newId}`;
              window.open(newUrl, '_blank');

              showNotification(`✅ Nouvel arbre ${classeChoisie} créé !`);
            } catch (error) {
              console.error('Erreur lors de la création:', error);
              showNotification('❌ Erreur lors de la création');
            }
          };

          // Dupliquer l'arbre actuel (crée une nouvelle URL)
          const dupliquerArbre = async () => {
            const confirmation = confirm(
              `Créer une copie de cet arbre de talents ?\n\n` +
              `Une nouvelle URL sera générée avec les mêmes talents.`
            );

            if (!confirmation) return;

            try {
              // Generate new ID for the copy
              const newId = Math.random().toString(36).substring(2, 15) +
                           Math.random().toString(36).substring(2, 15);

              // Copy data to new Firebase document
              const newTreeRef = db.collection('talent-trees').doc(newId);
              await newTreeRef.set({
                talents,
                talentsActifs: {}, // Reset active talents for copy
                nomPersonnage,
                niveau,
                arbreActuel,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });

              // Open new URL in new tab
              const newUrl = `${window.location.pathname}?id=${newId}`;
              window.open(newUrl, '_blank');

              showNotification('Copie créée ! Nouvelle URL ouverte dans un nouvel onglet.');
            } catch (error) {
              console.error('Erreur lors de la duplication:', error);
              showNotification('❌ Erreur lors de la duplication');
            }
          };

          const resetTalents = () => {
            setTalentsActifs({});
            setPointsDisponibles(pointsMax);
          };

          // Gestion du changement de niveau avec protection anti-triche
          const handleNiveauChange = (nouveauNiveau) => {
            // Si le nouveau niveau est inférieur à l'ancien
            if (nouveauNiveau < niveau) {
              const confirmation = window.confirm(
                "⚠️ ATTENTION ⚠️\n\nVous perdrez tous vos talents débloqués en réduisant votre niveau !\n\nVoulez-vous continuer ?"
              );

              if (confirmation) {
                setNiveau(nouveauNiveau);
                resetTalents();
                showNotification("Niveau réduit - Arbre de talents réinitialisé");
              }
              // Si pas de confirmation, on ne fait rien (le niveau reste inchangé)
            } else {
              // Niveau augmenté ou identique, pas de problème
              setNiveau(nouveauNiveau);
            }
          };

          // Fonction d'export en JSON
          const exportJSON = () => {
            const data = {
              talents,
              pointsMax: pointsMax,
              talentsActifs,
              version: '1.0'
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'arbre-talents.json';
            a.click();
            URL.revokeObjectURL(url);
          };

          // Fonction d'import JSON
          const importJSON = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = JSON.parse(e.target.result);
                if (data.talents) setTalents(data.talents);
                if (data.talentsActifs) setTalentsActifs(data.talentsActifs);
                if (data.pointsMax) setPointsDisponibles(data.pointsMax);
                alert('Import réussi !');
              } catch (error) {
                alert('Erreur lors de l\'import du fichier');
              }
            };
            reader.readAsText(file);
          };

          // Ajouter un nouveau talent
          const ajouterTalent = () => {
            const newId = `talent_${Date.now()}`;
            setTalents(prev => ({
              ...prev,
              [newId]: {
                id: newId,
                nom: 'Nouveau Talent',
                cout: 1,
                bonus: '',
                description: 'Description du talent',
                position: { x: 100, y: 20 },
                prerequis: [],
                categorie: 'vie',
                typeTalent: 'grand_carre',
                couleurTalent: 'action'
              }
            }));
            setEditingTalent(newId);
          };

          // Ajouter un talent VIE
          const ajouterTalentVie = () => {
            const newId = `talent_vie_${Date.now()}`;
            setTalents(prev => ({
              ...prev,
              [newId]: {
                id: newId,
                nom: 'VIE',
                cout: 1,
                bonus: '',
                description: 'VIE +1',
                position: { x: 100, y: 20 },
                prerequis: [],
                categorie: 'vie',
                typeTalent: 'petit_carre',
                couleurTalent: 'vie'
              }
            }));
            setEditingTalent(newId);
          };

          // Ajouter un talent ENDU
          const ajouterTalentEndu = () => {
            const newId = `talent_endu_${Date.now()}`;
            setTalents(prev => ({
              ...prev,
              [newId]: {
                id: newId,
                nom: 'ENDU',
                cout: 1,
                bonus: '',
                description: 'ENDU +2',
                position: { x: 100, y: 20 },
                prerequis: [],
                categorie: 'vie',
                typeTalent: 'petit_carre',
                couleurTalent: 'endu'
              }
            }));
            setEditingTalent(newId);
          };

          // Ajouter un talent DEGATS
          const ajouterTalentDegats = () => {
            const newId = `talent_degats_${Date.now()}`;
            setTalents(prev => ({
              ...prev,
              [newId]: {
                id: newId,
                nom: 'DEGATS',
                cout: 1,
                bonus: '',
                description: 'DEGATS +2',
                position: { x: 100, y: 20 },
                prerequis: [],
                categorie: 'vie',
                typeTalent: 'petit_carre',
                couleurTalent: 'degats'
              }
            }));
            setEditingTalent(newId);
          };

          // Supprimer un talent
          const supprimerTalent = (talentId) => {
            if (!confirm('Voulez-vous vraiment supprimer ce talent ?')) return;

            setTalents(prev => {
              const newTalents = { ...prev };
              delete newTalents[talentId];

              // Retirer ce talent des prérequis des autres
              Object.keys(newTalents).forEach(id => {
                newTalents[id].prerequis = newTalents[id].prerequis.filter(p => p !== talentId);
              });

              return newTalents;
            });

            setTalentsActifs(prev => {
              const newState = { ...prev };
              delete newState[talentId];
              return newState;
            });
          };

          // Dupliquer un talent
          const dupliquerTalent = (talentId) => {
            const talent = talents[talentId];
            if (!talent) return;

            const newId = `talent_${Date.now()}`;
            setTalents(prev => ({
              ...prev,
              [newId]: {
                ...talent,
                id: newId,
                nom: talent.nom,
                position: {
                  x: talent.position.x + 40,  // Décalage de 40px
                  y: talent.position.y + 40
                },
                prerequis: [...talent.prerequis] // Copier les prérequis
              }
            }));
            setEditingTalent(newId);
          };

          // Sauvegarder les modifications d'un talent
          const sauvegarderTalent = (talentId, updates) => {
            console.log('📝 ÉDITION TALENT:', talentId, 'Updates:', updates);
            setTalents(prev => {
              const newTalents = {
                ...prev,
                [talentId]: {
                  ...prev[talentId],
                  ...updates
                }
              };
              console.log('📝 Nouveau state talents après édition:', Object.keys(newTalents).length, 'talents');
              return newTalents;
            });
            setEditingTalent(null);
          };

          // Drag & Drop
          const handleDragStart = (e, talentId) => {
            if (!modeEdition) return;
            setDraggingTalent(talentId);

            // Capturer l'offset entre la souris et le coin supérieur gauche du talent
            const rect = e.currentTarget.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            setDragOffset({ x: offsetX, y: offsetY });

            e.dataTransfer.effectAllowed = 'move';
          };

          const handleDragEnd = () => {
            // Réinitialiser les états si le drag est annulé
            setDraggingTalent(null);
            setDragOffset(null);
            setTargetGridPoint(null);
          };

          const handleDragOver = (e) => {
            if (!modeEdition || !draggingTalent || !dragOffset) return;
            e.preventDefault();

            // Calculer où sera le coin supérieur gauche du talent
            const rect = e.currentTarget.getBoundingClientRect();
            // Prendre en compte le zoom dans les calculs
            // Position de la souris moins l'offset de clic moins le padding du container (32px = p-8)
            let x = (e.clientX - rect.left) / zoom - dragOffset.x / zoom - 32;
            let y = (e.clientY - rect.top) / zoom - dragOffset.y / zoom - 32;

            // Trouver la position X la plus proche
            let closestX = gridColumns[0];
            let minDistX = Math.abs(x - closestX);
            gridColumns.forEach(col => {
              const dist = Math.abs(x - col);
              if (dist < minDistX) {
                minDistX = dist;
                closestX = col;
              }
            });

            // Trouver la position Y la plus proche
            let closestY = gridRows[0];
            let minDistY = Math.abs(y - closestY);
            gridRows.forEach(row => {
              const dist = Math.abs(y - row);
              if (dist < minDistY) {
                minDistY = dist;
                closestY = row;
              }
            });

            // Mettre à jour le point cible
            setTargetGridPoint({ x: closestX, y: closestY });
          };

          const handleDrop = (e) => {
            if (!modeEdition || !draggingTalent || !targetGridPoint) return;
            e.preventDefault();

            // Utiliser le point cible calculé pendant le drag
            setTalents(prev => ({
              ...prev,
              [draggingTalent]: {
                ...prev[draggingTalent],
                position: { x: targetGridPoint.x, y: targetGridPoint.y }
              }
            }));

            // Réinitialiser les états de drag
            setDraggingTalent(null);
            setTargetGridPoint(null);
          };

          // Générer lien de partage pour les joueurs
          const genererLienPartage = () => {
            // Filtrer les talents pour le partage (exclure les cachés uniquement)
            const talentsVisibles = {};
            Object.keys(talents).forEach(id => {
              const talent = talents[id];
              // Ignorer les talents cachés
              if (talent.visible === false) return;

              talentsVisibles[id] = talent;
            });

            // Créer l'objet avec les données
            const dataToShare = {
              version: '2.0',
              classe: arbreActuel,
              talents: talentsVisibles, // Tous les talents visibles avec positions
              talentsActifs,
              nomPersonnage,
              niveau
            };

            // Encoder avec LZString pour compression (réduit la taille de 50-70%)
            const jsonString = JSON.stringify(dataToShare);
            console.log('Taille JSON non compressé:', jsonString.length, 'caractères');
            const encoded = LZString.compressToEncodedURIComponent(jsonString);
            console.log('Taille après compression:', encoded.length, 'caractères');

            // Construire l'URL complète avec les données compressées
            const baseUrl = window.location.origin + window.location.pathname;
            const url = `${baseUrl}?player=true&data=${encoded}`;
            console.log('Taille URL finale:', url.length, 'caractères');

            // Vérifier si l'URL est trop longue (limite ~8000 pour la plupart des navigateurs)
            if (url.length > 8000) {
              alert(`⚠️ ERREUR : Arbre de talents trop grand pour être partagé par URL\n\nTaille actuelle : ${url.length} caractères\nLimite maximale : 8000 caractères\n\nOptimisations déjà appliquées :\n✓ Talents cachés exclus\n✓ Compression LZString activée\n\nSolutions :\n1. Cachez plus de talents (bouton 👁️ en mode édition)\n2. Utilisez l'export JSON à la place (bouton "Exporter JSON")\n3. Réduisez les descriptions de talents`);
              return;
            }

            // Copier dans le presse-papier
            navigator.clipboard.writeText(url).then(() => {
              alert(`✅ Lien copié dans le presse-papier !\n\nTaille : ${url.length} caractères\nTalents visibles : ${Object.keys(talentsVisibles).length}\n\nLes joueurs pourront voir et activer les talents, mais pas modifier l\'arbre.`);
            }).catch(err => {
              console.error('Erreur lors de la copie:', err);
            });

            // Ouvrir dans un nouvel onglet
            window.open(url, '_blank');
          };

                <div className={`${modePrint ? 'bg-white' : 'bg-slate-700'} ${modeLectureSeule ? 'border-x-2' : 'border-x-2'} border-amber-500 p-4 flex flex-wrap items-center gap-3 no-print`}>

                    <button

                                const isTarget = targetGridPoint &&
                                  targetGridPoint.x === col &&
                                  targetGridPoint.y === row;

                                return (
                                  <circle
                                    key={`grid-${rowIndex}-${colIndex}`}
                                    cx={col + 32}
                                    cy={row + 32}
                                    r={isTarget ? "8" : "4"}
                                    fill={isTarget ? "#22c55e" : "#fbbf24"}
                                    opacity={isTarget ? "1" : "0.5"}
                                  />
                                );
                              })
                            )}
                          </g>
                        )}

                        {/* Lignes de connexion */}
                        {Object.values(talents).filter(talent => {
                          // En mode édition, afficher toutes les connexions
                          // Sinon, afficher seulement les connexions vers des talents visibles
                          return modeEdition || talent.visible !== false;
                        }).map(talent =>
                          talent.prerequis.map((prereqId, prereqIndex) => {
                            const prereq = talents[prereqId];
                            if (!prereq) return null;
                            // Masquer les connexions vers des prérequis invisibles en mode non-édition
                            if (!modeEdition && prereq.visible === false) return null;
                            const isActive = talentsActifs[prereqId] && talentsActifs[talent.id];
                            const isHighlighted = hoveredTalent === talent.id || hoveredTalent === prereqId;

                            // Calculer les centres des talents selon leurs dimensions réelles
                            const prereqDim = getDimensionsTalent(prereq);
                            const talentDim = getDimensionsTalent(talent);

                            // Centres des talents (ajout de 32px pour le padding du container p-8)
                            // Le centre dépend maintenant de la taille du talent
                            const x1 = prereq.position.x + (prereqDim.width / 2) + 32;
                            const y1 = prereq.position.y + (prereqDim.height / 2) + 32;
                            const x2 = talent.position.x + (talentDim.width / 2) + 32;
                            const y2 = talent.position.y + (talentDim.height / 2) + 32;

                            const strokeColor = isActive ? '#fbbf24' : isHighlighted ? '#94a3b8' : '#94a3b8';
                            const strokeW = isActive ? 3 : isHighlighted ? 3 : 3;
                            const dashArray = isActive ? '0' : '0';

                            // Calculer le centre de la ligne pour le badge de points requis
                            const midX = (x1 + x2) / 2;
                            const midY = (y1 + y2) / 2;

                            // Vérifier si ce talent a des points requis
                            const hasPointsRequis = talent.pointsRequis && talent.pointsRequis > 0;
                            let pointsRestants = 0;
                            let badgeColor = '';
                            let lockIcon = '🔒';

                            if (hasPointsRequis) {
                              const pointsDepenses = pointsMax - pointsDisponibles;
                              pointsRestants = Math.max(0, talent.pointsRequis - pointsDepenses);

                              if (talentsActifs[talent.id] || pointsRestants === 0) {
                                badgeColor = '#16a34a'; // Green
                                lockIcon = '🔓';
                              } else if (pointsRestants <= talent.pointsRequis * 0.5) {
                                badgeColor = '#eab308'; // Yellow
                              } else {
                                badgeColor = '#ea580c'; // Orange
                              }
                            }

                            return (
                              <g key={`${prereqId}-${talent.id}`}>
                                {/* Ligne droite entre les centres */}
                                <line
                                  x1={x1}
                                  y1={y1}
                                  x2={x2}
                                  y2={y2}
                                  stroke={strokeColor}
                                  strokeWidth={strokeW}
                                  strokeDasharray={dashArray}
                                  className="transition-all duration-300"
                                />

                                {/* Badge de points requis au centre de la ligne (seulement sur la première ligne) */}
                                {hasPointsRequis && prereqIndex === 0 && (
                                  <g>
                                    {/* Rectangle du badge */}
                                    <rect
                                      x={midX - 20}
                                      y={midY - 12}
                                      width="40"
                                      height="24"
                                      rx="4"
                                      fill={badgeColor}
                                      stroke={strokeColor}
                                      strokeWidth="2"
                                    />
                                    {/* Texte du badge */}
                                    <text
                                      x={midX}
                                      y={midY + 5}
                                      textAnchor="middle"
                                      fill="white"
                                      fontSize="14"
                                      fontWeight="bold"
                                    >
                                      {lockIcon}{pointsRestants}
                                    </text>
                                  </g>
                                )}
                              </g>
                            );
                          })
                        )}
                      </svg>

                      {/* Talents */}
                      <div className="relative" style={{ zIndex: 2 }}>
                        {Object.values(talents).filter(talent => {
                          // En mode édition, afficher tous les talents
                          // Sinon, afficher seulement les talents visibles
                          return modeEdition || talent.visible !== false;
                        }).map(talent => {
                          const isActive = talentsActifs[talent.id];
                          const isAvailable = peutEtreActive(talent.id);
                          const isHovered = hoveredTalent === talent.id;
                          const categorie = categories[talent.categorie];
                          const isEditing = editingTalent === talent.id;
                          const dimensions = getDimensionsTalent(talent);

                          // Point d'ancrage en haut à gauche (pas de centrage)
                          const offsetX = 0;
                          const offsetY = 0;

                          return (
                            <div
                              key={talent.id}
                              className={`absolute group ${draggingTalent === talent.id ? 'dragging' : ''}`}
                              style={{
                                left: `${talent.position.x}px`,
                                top: `${talent.position.y}px`,
                                width: `${dimensions.width}px`,
                                height: `${dimensions.height}px`,
                                maxHeight: `${dimensions.height}px`,
                                minHeight: `${dimensions.height}px`,
                                overflow: 'visible'
                              }}
                              draggable={modeEdition && !isEditing}
                              onDragStart={(e) => handleDragStart(e, talent.id)}
                              onDragEnd={handleDragEnd}
                              onMouseEnter={() => !modeEdition && setHoveredTalent(talent.id)}
                              onMouseLeave={() => setHoveredTalent(null)}
                            >
                              {isEditing ? (
                                // Formulaire d'édition - Box fixe déportée
                                <div
                                  key={talent.id}
                                  className="absolute bg-slate-800 border-2 border-amber-500 rounded-lg p-3 shadow-xl overflow-y-auto no-print"
                                  style={{
                                    width: '480px',
                                    maxHeight: '90vh',
                                    top: '0',
                                    // Si le talent est à droite (x > 900), positionner à gauche du talent
                                    [talent.position.x > 900 ? 'right' : 'left']: '0',
                                    zIndex: 1000
                                  }}
                                >
                                  {/* Boutons sauvegarde et fermeture */}
                                  <div className="absolute top-2 right-2 flex gap-1">
                                    <button
                                      onClick={() => {
                                        // Récupérer les prérequis cochés
                                        const prerequis = Array.from(document.querySelectorAll(`.prereq-check[data-talent-id="${talent.id}"]:checked`))
                                          .map(checkbox => checkbox.getAttribute('data-prereq-id'));

                                        // Récupérer les effets spéciaux
                                        const effetType = document.getElementById(`effet-type-${talent.id}`).value;
                                        const effetSource = document.getElementById(`effet-source-${talent.id}`).value;
                                        const effetMult = parseFloat(document.getElementById(`effet-mult-${talent.id}`).value) || 1;

                                        const effetSpecial = effetType !== 'aucun' ? {
                                          type: effetType,
                                          source: effetSource,
                                          multiplicateur: effetMult,
                                          valeur: effetSource === 'fixe' ? effetMult : undefined
                                        } : undefined;

                                        // Récupérer la compétence
                                        const competence = document.getElementById(`competence-${talent.id}`).value || undefined;

                                        sauvegarderTalent(talent.id, {
                                          nom: document.getElementById(`nom-${talent.id}`).value,
                                          description: document.getElementById(`desc-${talent.id}`).value,
                                          cout: parseInt(document.getElementById(`cout-${talent.id}`).value),
                                          typeTalent: document.getElementById(`type-${talent.id}`).value,
                                          couleurTalent: document.getElementById(`couleur-${talent.id}`).value,
                                          prerequis: prerequis,
                                          effetSpecial: effetSpecial,
                                          competence: competence
                                        });
                                      }}
                                      className="w-6 h-6 bg-green-600 hover:bg-green-700 text-white rounded-full flex items-center justify-center font-bold text-sm transition-colors"
                                      title="Sauvegarder et fermer"
                                    >
                                      ✓
                                    </button>
                                    <button
                                      onClick={() => setEditingTalent(null)}
                                      className="w-6 h-6 bg-red-600 hover:bg-red-700 text-white rounded-full flex items-center justify-center font-bold text-xs transition-colors"
                                      title="Fermer sans sauvegarder"
                                    >
                                      ×
                                    </button>
                                  </div>

                                  {/* Grille à 2 colonnes */}
                                  <div className="grid grid-cols-2 gap-3">
                                    {/* Colonne 1 - Propriétés de base */}
                                    <div>
                                      <input
                                        type="text"
                                        defaultValue={talent.nom}
                                        placeholder="Nom"
                                        className="w-full mb-2 p-1 text-sm bg-slate-700 text-white rounded"
                                        id={`nom-${talent.id}`}
                                      />
                                      <textarea
                                        defaultValue={talent.description}

                                        className="w-full mb-2 p-1 text-xs bg-slate-700 text-white rounded"

                                        id={`desc-${talent.id}`}

                                      <input

                                      <div className="text-xs text-slate-400 mb-1">

                                      <input
                                        type="number"
                                        defaultValue={talent.pointsRequis || 0}

                                        min="0"
                                        className="w-full mb-2 p-1 text-sm bg-slate-700 text-white rounded"
                                        id={`points-requis-${talent.id}`}
                                      />
                                      <select
                                        defaultValue={talent.typeTalent || 'grand_carre'}
                                        className="w-full mb-2 p-1 text-sm bg-slate-700 text-white rounded"
                                        id={`type-${talent.id}`}
                                      >
                                        {['grand_carre', 'rectangle', 'petit_carre'].map(type => (
                                          <option key={type} value={type}>
                                            {typesTalent[type].nom} ({typesTalent[type].width}x{typesTalent[type].height})
                                          </option>

                                      </select>
                                      <select
                                        defaultValue={talent.couleurTalent || 'action'}

                                        {Object.entries(couleursTalent)

                                            <option key={key} value={key} style={{ backgroundColor: value.code, color: 'white' }}>
                                              {value.nom}

                                      </select>

                                      <div className="mb-2 p-2 bg-slate-700 rounded">

                                          className="w-full mb-1 p-1 text-xs bg-slate-600 text-white rounded"
                                          id={`effet-type-${talent.id}`}
                                        >
                                          <option value="aucun">Aucun effet</option>
                                          <option value="bonus_vie">Bonus VIE</option>
                                          <option value="bonus_endu">Bonus ENDU</option>
                                          <option value="bonus_degats">Bonus DÉGÂTS</option>
                                          <option value="bonus_pv">Bonus PV</option>
                                        </select>
                                        <select
                                          defaultValue={talent.effetSpecial?.source || 'fixe'}
                                          className="w-full mb-1 p-1 text-xs bg-slate-600 text-white rounded"
                                          id={`effet-source-${talent.id}`}
                                        >
                                          <option value="fixe">Valeur fixe</option>
                                          <option value="endu">Basé sur ENDU</option>
                                          <option value="vie">Basé sur VIE</option>
                                          <option value="degats">Basé sur DÉGÂTS</option>
                                          <option value="niveau">Basé sur NIVEAU</option>
                                        </select>
                                        <input
                                          type="number"
                                          step="0.1"

                                          id={`effet-mult-${talent.id}`}
                                        />

                                          Ex: ENDU × 0.5 = moitié de l'ENDU
                                        </div>
                                      </div>
                                    </div>

                                    {/* Colonne 2 - Compétences, Prérequis, Remplace */}
                                    <div>
                                      {/* Compétence Bonus */}
                                      <div className="mb-2 p-2 bg-slate-700 rounded">
                                    <div className="text-xs text-white mb-1 font-semibold">Compétence Bonus:</div>
                                    <select
                                      defaultValue={talent.competence || ''}
                                      className="w-full p-1 text-xs bg-slate-600 text-white rounded"
                                      id={`competence-${talent.id}`}
                                    >
                                      <option value="">Aucune</option>
                                      {COMPETENCES.map(comp => (
                                        <option key={comp} value={comp}>{comp}</option>
                                      ))}
                                    </select>
                                    <div className="text-xs text-slate-400 mt-1">
                                      Affiche un badge orange avec le nom de la compétence qui reçoit un bonus
                                    </div>
                                  </div>

                                  {/* Sélecteur de prérequis */}
                                  <div className="mb-2 p-2 bg-slate-700 rounded">
                                    <div className="text-xs text-white mb-1 font-semibold">Prérequis:</div>
                                    <div className="max-h-32 overflow-y-auto text-xs">
                                      {Object.values(talents)
                                        .filter(t => t.id !== talent.id)
                                        .sort((a, b) => a.nom.localeCompare(b.nom))
                                        .map(t => (
                                          <label key={t.id} className="flex items-center gap-1 text-white cursor-pointer hover:bg-slate-600 px-1 rounded">
                                            <input
                                              type="checkbox"
                                              defaultChecked={talent.prerequis.includes(t.id)}
                                              className="prereq-check"
                                              data-talent-id={talent.id}
                                              data-prereq-id={t.id}
                                            />
                                            <span>{t.nom}</span>
                                          </label>
                                        ))
                                      }
                                    </div>
                                  </div>

                                  {/* Talent Remplacé */}
                                  <div className="mb-2 p-2 bg-slate-700 rounded">
                                    <div className="text-xs text-white mb-1 font-semibold">Remplace (version améliorée):</div>
                                    <select
                                      defaultValue={talent.remplace || ''}
                                      className="w-full p-1 text-xs bg-slate-600 text-white rounded"
                                      id={`remplace-${talent.id}`}
                                    >
                                      <option value="">Aucun</option>
                                      {/* Talents automatiques de base */}
                                      <option value="auto_attaque">Attaque</option>
                                      <option value="auto_degats_opportunite">Dégâts d'Opportunité</option>
                                      {/* Talents de l'arbre */}
                                      {Object.values(talents)
                                        .filter(t => t.id !== talent.id)
                                        .sort((a, b) => a.nom.localeCompare(b.nom))
                                        .map(t => (
                                          <option key={t.id} value={t.id}>{t.nom}</option>
                                        ))
                                      }
                                    </select>
                                        <div className="text-xs text-slate-400 mt-1">
                                          Si ce talent remplace un autre (ex: Grenade 2 remplace Grenade)
                                        </div>
                                      </div>
                                    </div>
                                  </div>

                                  {/* Boutons d'action en bas */}
                                  <div className="flex flex-col gap-2">
                                    <div className="flex gap-2">
                                      <button
                                        onClick={() => {
                                          // Récupérer les prérequis cochés
                                          const prerequis = Array.from(document.querySelectorAll(`.prereq-check[data-talent-id="${talent.id}"]:checked`))
                                            .map(checkbox => checkbox.getAttribute('data-prereq-id'));

                                          // Récupérer le talent remplacé
                                          const remplace = document.getElementById(`remplace-${talent.id}`).value || undefined;

                                          // Récupérer les effets spéciaux
                                          const effetType = document.getElementById(`effet-type-${talent.id}`).value;
                                          const effetSource = document.getElementById(`effet-source-${talent.id}`).value;
                                          const effetMult = parseFloat(document.getElementById(`effet-mult-${talent.id}`).value) || 1;

                                          const effetSpecial = effetType !== 'aucun' ? {
                                            type: effetType,
                                            source: effetSource,
                                            multiplicateur: effetMult,
                                            valeur: effetSource === 'fixe' ? effetMult : undefined
                                          } : undefined;

                                          // Récupérer la compétence
                                          const competence = document.getElementById(`competence-${talent.id}`).value || undefined;

                                          // Récupérer les points requis
                                          const pointsRequis = parseInt(document.getElementById(`points-requis-${talent.id}`).value) || 0;

                                          sauvegarderTalent(talent.id, {
                                            nom: document.getElementById(`nom-${talent.id}`).value,
                                            description: document.getElementById(`desc-${talent.id}`).value,
                                            cout: parseInt(document.getElementById(`cout-${talent.id}`).value),
                                            pointsRequis: pointsRequis > 0 ? pointsRequis : undefined,
                                            typeTalent: document.getElementById(`type-${talent.id}`).value,
                                            couleurTalent: document.getElementById(`couleur-${talent.id}`).value,
                                            prerequis: prerequis,
                                            remplace: remplace,
                                            effetSpecial: effetSpecial,
                                            competence: competence

                                        className="flex-1 px-2 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-xs"
                                      >
                                        Sauvegarder
                                      </button>
                                      <button
                                        onClick={() => {
                                          // Désactiver tous les prérequis

                                        className="flex-1 px-2 py-1 bg-orange-600 hover:bg-orange-700 text-white rounded text-xs"
                                      >
                                        Briser les Liens

                                    <div className="flex gap-2">

                                      <button

                                        className="flex-1 px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs"
