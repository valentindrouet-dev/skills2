                                    </div>
                                  </div>
                                </div>
                              ) : (

                                <div className="relative">
                                  <button
                                    onClick={() => modeEdition ? setEditingTalent(talent.id) : toggleTalent(talent.id)}
                                    style={{
                                      backgroundColor: isActive ? getCouleurTalent(talent) : (modePrint ? 'white' : undefined),
                                      boxSizing: 'border-box',
                                      height: `${dimensions.height}px`,
                                      maxHeight: `${dimensions.height}px`,
                                      minHeight: `${dimensions.height}px`,
                                      width: `${dimensions.width}px`,
                                      maxWidth: `${dimensions.width}px`,
                                      minWidth: `${dimensions.width}px`
                                    }}
                                    className={`
                                      rounded-lg border-2 transition-all duration-300 relative print-talent p-1
                                      ${isActive
                                        ? 'border-amber-400 shadow-lg shadow-amber-500/50 active'
                                        : isAvailable
                                        ? `${modePrint ? 'bg-white' : 'bg-slate-600'} border-slate-400 hover:border-amber-400 hover:shadow-lg`
                                        : `${modePrint ? 'bg-white' : 'bg-slate-800'} border-slate-700 cursor-not-allowed`
                                      }
                                      ${isHovered ? 'ring-2 ring-amber-400' : ''}
                                      ${modeEdition ? 'cursor-move' : ''}
                                      ${modeEdition && talent.visible === false ? 'opacity-50 border-dashed' : ''}
                                    `}
                                  >
                                    {/* Coût */}
                                    <div className={`
                                      absolute -top-3 -right-3 w-6 h-6 rounded-full

                                    {talent.competence && (

                                    <div className="w-full h-full flex flex-col items-center justify-center overflow-hidden">
                                      {isGrandCarre(talent) && (
                                        <>
                                          <div className="text-white font-bold mb-1 text-center line-clamp-2" style={{ fontSize: `${getDynamicFontSize(talent.nom, 1.3, dimensions.width - 20)}rem` }}>
                                            {talent.nom}
                                          </div>
                                          <div
                                            className="text-slate-200 font-bold text-center leading-tight line-clamp-7"
                                            style={{ whiteSpace: 'pre-line', fontSize: `${getDynamicFontSize(talent.description, 0.9375, dimensions.width - 20)}rem` }}
                                            dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                          />
                                        </>
                                      )}

                                      {isRectangle(talent) && (
                                        <div
                                          className="text-slate-200 font-bold text-center leading-tight line-clamp-3"
                                          style={{ whiteSpace: 'pre-line', fontSize: `${getDynamicFontSize(talent.description, 0.9375, dimensions.width - 20)}rem` }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                        />
                                      )}

                                      {isPetitCarre(talent) && (
                                        <div
                                          className="text-slate-200 font-bold text-center leading-tight line-clamp-3"
                                          style={{ whiteSpace: 'pre-line', fontSize: `${getDynamicFontSize(talent.description, 0.9375, dimensions.width - 20)}rem` }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                        />
                                      )}
                                    </div>
                                  </button>

                                  {/* Boutons d'édition */}
                                  {modeEdition && (
                                    <div className="absolute -bottom-8 left-0 right-0 flex gap-1 justify-center no-print">
                                      <button
                                        onClick={() => {
                                          sauvegarderTalent(talent.id, {
                                            visible: !talent.visible
                                          });
                                        }}
                                        className={`px-2 py-1 ${talent.visible !== false ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-600 hover:bg-gray-700'} text-white rounded text-xs`}
                                        title={talent.visible !== false ? "Talent visible - Cliquer pour masquer" : "Talent masqué - Cliquer pour afficher"}
                                      >
                                        {talent.visible !== false ? '👁️' : '👁️‍🗨️'}
                                      </button>
                                      <button
                                        onClick={() => setEditingTalent(talent.id)}
                                        className="px-2 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs"
                                      >
                                        ✏️
                                      </button>
                                      <button
                                        onClick={() => dupliquerTalent(talent.id)}
                                        className="px-2 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-xs"

                                        📋
                                      </button>
                                      <button
                                        onClick={() => supprimerTalent(talent.id)}
                                        className="px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs"
                                      >
                                        🗑️
                                      </button>
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                      </div>
                  </div>
                  </>
                )}

                {/* Vue Feuille de personnage */}
                {vueActive === 'feuille' && (
                  <div className="bg-white rounded-b-lg p-4 shadow-2xl text-black print-feuille">
                    <h2 className="text-2xl font-bold mb-3 text-center border-b-2 border-amber-500 pb-2">
                      Feuille de Personnage
                    </h2>

                    {/* Caractéristiques du personnage */}
                    <div className={`mb-4 p-3 ${modePrint ? 'bg-white' : 'bg-slate-100'} border-2 border-slate-300 rounded`}>
                      {/* Infos de base */}
                      <div className="flex flex-wrap items-center gap-4 text-sm mb-3 pb-3 border-b border-slate-300">
                        <div className="flex items-center gap-2">
                          <span className="font-bold">NOM :</span>
                          <span className="px-2 py-1 rounded font-bold text-white uppercase" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {nomPersonnage || '(Non défini)'}
                          </span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold">CLASSE :</span>
                          <span className="px-2 py-1 rounded font-bold text-white uppercase" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {arbreActuel}
                          </span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold">NIVEAU :</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {niveau}
                          </span>
                        </div>
                      </div>

                      {/* Stats : DÉGÂTS, PV, formule */}
                      <div className="flex flex-wrap items-center gap-3 text-sm mb-3 pb-3 border-b border-slate-300">
                        <div className="flex items-center gap-2">
                          <span className="font-bold">DÉGÂTS :</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: couleursTalent.degats.code }}>
                            +{getTotalDegats()}
                          </span>
                        </div>
                        <div className="h-6 border-l-2 border-slate-400"></div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold">PV :</span>
                          <span className="px-2 py-1 bg-green-700 text-white rounded font-bold">
                            {getPointsDeVie()}
                          </span>
                          <span className="font-bold">=</span>
                          <span className="font-bold">VIE :</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: couleursTalent.vie.code }}>
                            {getTotalVie()}
                          </span>
                          <span className="font-bold">×</span>
                          <span className="font-bold">ENDU :</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: couleursTalent.endu.code }}>
                            {getTotalEndu()}
                          </span>
                          <span className="font-bold">+</span>
                          <span className="font-bold">BONUS :</span>
                          <span className="px-2 py-1 rounded font-bold text-white" style={{ backgroundColor: getCouleurClasseHex(arbreActuel) }}>
                            {getBonusPV()}
                          </span>
                        </div>
                      </div>

                      {/* Compétences sur une seule ligne */}
                      {getCompetencesActives().length > 0 && (
                        <div className="flex flex-wrap items-center gap-3 text-sm">
                          {getCompetencesActives().map(comp => (
                            <div key={comp} className="flex items-center gap-2">
                              <span className="font-bold">{comp} :</span>
                              <span className="px-2 py-1 bg-orange-600 text-white rounded font-bold">
                                +{getTotalCompetence(comp)}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Récapitulatif compact */}
                    <div className="mb-3 p-2 bg-amber-50 border border-amber-500 rounded flex justify-between text-sm">
                      <span><strong>Points:</strong> {pointsMax - pointsDisponibles}/{pointsMax}</span>
                      <span><strong>Talents:</strong> {Object.keys(talentsActifs).length}</span>
                      <span><strong>Bonus:</strong> {Object.entries(talentsActifs).filter(([id]) => talents[id]?.bonus).length}</span>
                    </div>

                    {/* Talents actifs groupés par type */}
                    <div className="flex gap-6">
                        {/* Colonne gauche */}
                        <div className="flex-1 flex flex-col gap-6">
                          {['action', 'passif', 'maitrise']
                            .map(typeKey => {
                              const typeInfo = couleursTalent[typeKey];
                              if (!typeInfo) return null;
                              const talentsDeCeType = Object.entries(talentsActifs).filter(([id]) => {
                                const talent = talents[id];
                                // Exclure les talents remplacés par une version améliorée
                                return talent?.couleurTalent === typeKey && !estRemplace(id);
                              }).sort((a, b) => {
                                // Tri alphabétique par nom de talent
                                const talentA = talents[a[0]];
                                const talentB = talents[b[0]];
                                return talentA.nom.localeCompare(talentB.nom);
                              });

                              // Pour les actions, toujours afficher si Attaque n'est pas remplacée
                              // Pour les autres, ne rien afficher si aucun talent
                              if (talentsDeCeType.length === 0 && typeKey === 'action' && estTalentAutoRemplace('auto_attaque')) return null;
                              if (talentsDeCeType.length === 0 && typeKey !== 'action') return null;

                              return (
                                <div key={typeKey}>
                                  <h3 className="text-lg font-bold mb-3 pb-1 border-b border-slate-300" style={{ color: typeInfo.code }}>
                                    {typeInfo.nom}
                                  </h3>
                                  <div className="grid grid-cols-2 gap-3">
                                    {/* Attaque - automatique pour tous (sauf si remplacée) */}
                                    {typeKey === 'action' && !estTalentAutoRemplace('auto_attaque') && (
                                      <div
                                        key="attaque-base"
                                        className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                      >
                                        {/* Titre en couleur */}
                                        <div className="font-bold text-left mb-1" style={{ color: couleursTalent.action.code, fontSize: '0.95rem' }}>
                                          Attaque
                                        </div>

                                        {/* Description alignée à gauche */}
                                        <div
                                          className="text-slate-700 text-left leading-tight"
                                          style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                        >
                                          {`Vous effectuez 1 attaque\n(Arme + ${getTotalDegats()} dégâts)`}
                                        </div>
                                      </div>
                                    )}

                                    {talentsDeCeType.map(([id]) => {
                                      const talent = talents[id];
                                      const couleur = getCouleurTalent(talent);

                                      return (
                                        <div
                                          key={id}
                                          className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                        >
                                          {/* Titre en couleur */}
                                          <div className="font-bold text-left mb-1" style={{ color: couleur, fontSize: '0.95rem' }}>
                                            {talent.nom}
                                          </div>

                                          {/* Description alignée à gauche */}
                                          <div
                                            className="text-slate-700 text-left leading-tight"
                                            style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                            dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                          />
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                        </div>

                        {/* Colonne droite */}
                        <div className="flex-1 flex flex-col gap-6">
                          {['reaction', 'amelioration', 'aventure']
                            .map(typeKey => {
                              const typeInfo = couleursTalent[typeKey];
                              if (!typeInfo) return null;
                              const talentsDeCeType = Object.entries(talentsActifs).filter(([id]) => {
                                const talent = talents[id];
                                // Exclure les talents remplacés par une version améliorée
                                return talent?.couleurTalent === typeKey && !estRemplace(id);
                              }).sort((a, b) => {
                                // Tri alphabétique par nom de talent
                                const talentA = talents[a[0]];
                                const talentB = talents[b[0]];
                                return talentA.nom.localeCompare(talentB.nom);
                              });

                              // Pour les réactions, toujours afficher si Dégâts d'Opportunité n'est pas remplacée
                              // Pour les autres, ne rien afficher si aucun talent
                              if (talentsDeCeType.length === 0 && typeKey === 'reaction' && estTalentAutoRemplace('auto_degats_opportunite')) return null;
                              if (talentsDeCeType.length === 0 && typeKey !== 'reaction') return null;

                              return (
                                <div key={typeKey}>
                                  <h3 className="text-lg font-bold mb-3 pb-1 border-b border-slate-300" style={{ color: typeInfo.code }}>
                                    {typeInfo.nom}
                                  </h3>
                                  <div className="grid grid-cols-2 gap-3">
                                    {/* Dégâts d'Opportunité - automatique pour tous (sauf si remplacée) */}
                                    {typeKey === 'reaction' && !estTalentAutoRemplace('auto_degats_opportunite') && (
                                      <div
                                        key="degats-opportunite"
                                        className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                      >
                                        {/* Titre en couleur */}
                                        <div className="font-bold text-left mb-1" style={{ color: couleursTalent.reaction.code, fontSize: '0.95rem' }}>
                                          Dégâts d'Opportunité
                                        </div>

                                        {/* Description alignée à gauche */}
                                        <div
                                          className="text-slate-700 text-left leading-tight"
                                          style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                          dangerouslySetInnerHTML={{ __html: replaceMarkers('<em>Quand un adversaire quitte votre contact,</em>\n\nVous lui infligez {DEGATS} dégâts') }}
                                        />
                                      </div>
                                    )}

                                    {talentsDeCeType.map(([id]) => {
                                      const talent = talents[id];
                                      const couleur = getCouleurTalent(talent);

                                      return (
                                        <div
                                          key={id}
                                          className="rounded-lg border border-slate-300 p-2 shadow-sm bg-white"
                                        >
                                          {/* Titre en couleur */}
                                          <div className="font-bold text-left mb-1" style={{ color: couleur, fontSize: '0.95rem' }}>
                                            {talent.nom}
                                          </div>

                                          {/* Description alignée à gauche */}
                                          <div
                                            className="text-slate-700 text-left leading-tight"
                                            style={{ whiteSpace: 'pre-line', fontSize: '0.8rem' }}
                                            dangerouslySetInnerHTML={{ __html: replaceMarkers(talent.description) }}
                                          />
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                        </div>
                      </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArbreTalents />);
    </script>
</body>
</html>
